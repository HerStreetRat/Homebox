<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homebox</title>
<meta name="description" content="Home equipment, tools and parts log with maintenance reminders.">
<meta name="theme-color" content="#2C6A4D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Homebox">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100% }
img { max-width: 100% }
/* Layout: a single column workbench — summary strip, then two tabs (maintenance due / equipment list); forms open as sheets. */
:root {
  --bg: #F3F3F4; --surface: #FFFFFF; --sunk: #E9E9EB; --ink: #1E1E21; --muted: #616166; --line: #D7D7DB;
  --accent: #2C6A4D; --accent-ink: #FFFFFF; --tag: #EADFC2; --tag-ink: #5A4A1E;
  --over: #B2321E; --soon: #9A6200; --ok: #2C6A4D;
  --display: "Bitter", "Rockwell", Georgia, serif;
  --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161618; --surface: #1F1F22; --sunk: #28282C; --ink: #E8E8EA; --muted: #A0A0A6; --line: #34343A;
  --accent: #72C49A; --accent-ink: #0D1310; --tag: #3A3322; --tag-ink: #E6D3A3;
  --over: #F27D69; --soon: #E5AA42; --ok: #72C49A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161618; --surface: #1F1F22; --sunk: #28282C; --ink: #E8E8EA; --muted: #A0A0A6; --line: #34343A;
  --accent: #72C49A; --accent-ink: #0D1310; --tag: #3A3322; --tag-ink: #E6D3A3;
  --over: #F27D69; --soon: #E5AA42; --ok: #72C49A; color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 880px; margin: 0 auto; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand h1 { font-size: 38px; font-weight: 800; letter-spacing: .04em; line-height: 1; text-transform: uppercase }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px }
.actions { display: flex; gap: 8px; flex-wrap: wrap }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; white-space: nowrap }
a.btn { color: var(--ink); text-decoration: none; display: inline-block }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.small { padding: 4px 10px; font-size: 13px }
.btn.danger { color: var(--over) }
.btn.danger.armed { background: var(--over); color: var(--surface); border-color: var(--over) }
.btn.link { border: 0; background: none; padding: 4px 6px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px }

.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface) }
.strip > div { padding: 12px 14px; border-left: 1px solid var(--line); min-width: 0 }
.strip > div:first-child { border-left: 0 }
.strip b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums }
.strip span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.strip .over b { color: var(--over) } .strip .soon b { color: var(--soon) }
@media (max-width: 560px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .strip > div:nth-child(3) { border-left: 0 } .strip > div:nth-child(n+3) { border-top: 1px solid var(--line) } }

nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 28px 0 0; border-bottom: 1px solid var(--line) }
nav.tabs button { white-space: nowrap; flex: none; border: 0; background: none; padding: 10px 14px; cursor: pointer; font-family: var(--body); font-weight: 700; font-size: 16px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 }
.toolbar input, .toolbar select { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); min-width: 0 }
.toolbar input { flex: 1 1 200px }

.group h3, h3.grp { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--body); font-weight: 600; margin: 22px 0 8px }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden }
.row { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 0 14px; align-items: center; padding: 12px 14px 12px 0; border-top: 1px solid var(--line) }
.row:first-child { border-top: 0 }
.row .stripe { align-self: stretch; background: var(--line) }
.row.over .stripe { background: var(--over) } .row.soon .stripe { background: var(--soon) } .row.ok .stripe { background: var(--ok); opacity: .45 }
.row .main { min-width: 0 }
.row .title { font-weight: 600; overflow-wrap: anywhere }
.row .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 2px }
.row .side { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end }
.row.clickable { cursor: pointer } .row.clickable:hover { background: var(--sunk) }
@media (max-width: 560px) { .row { grid-template-columns: 6px minmax(0, 1fr) } .row .side { grid-column: 2; justify-content: flex-start; margin-top: 8px } }

.due { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums }
.over .due, .txt-over { color: var(--over) } .soon .due, .txt-soon { color: var(--soon) }
.log { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden }
.log .entry { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 10px 12px; border-top: 1px solid var(--line) }
.log .entry:first-child { border-top: 0 }
.log .entry .what { overflow-wrap: anywhere } .log .entry .sm { color: var(--muted); font-size: 13px }
@media (max-width: 480px) { .log .entry { grid-template-columns: minmax(0, 1fr) auto } .log .entry .due { grid-column: 1 / -1 } }
.log .entry.chk { grid-template-columns: auto minmax(0, 1fr) auto; align-items: center }
.log .entry.chk input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent) }
.log .entry.chk label { cursor: pointer; overflow-wrap: anywhere }
.log .entry.chk label.done { color: var(--muted); text-decoration: line-through }
@media (max-width: 480px) { .log .entry.chk { grid-template-columns: auto minmax(0, 1fr) auto } }
form.pj-add { display: flex; gap: 8px; margin-top: 8px }
form.pj-add input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg) }
.checks { display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); font-weight: 400 }
.checks label { display: flex; gap: 8px; align-items: center }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 3px; background: var(--tag); color: var(--tag-ink); font-weight: 500 }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; font-weight: 500; white-space: nowrap }
.pill.over { color: var(--over) } .pill.soon { color: var(--soon) } .pill.ok { color: var(--ok) } .pill.none { color: var(--muted) }
.ex { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px dashed var(--muted); border-radius: 3px; padding: 0 5px; margin-left: 6px; vertical-align: 2px }
.mono { font-family: var(--mono); font-size: 13px }

.empty { padding: 32px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); background: var(--surface) }
.empty strong { display: block; color: var(--ink); font-family: var(--display); font-size: 18px; margin-bottom: 4px }
.notice { padding: 10px 14px; border-radius: var(--radius); background: var(--sunk); color: var(--muted); font-size: 14px; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px) }
dialog::backdrop { background: rgb(0 0 0 / .45) }
.sheet { padding: 20px }
.sheet h2 { font-size: 21px; margin-bottom: 14px; overflow-wrap: anywhere }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.fields .full { grid-column: 1 / -1 }
@media (max-width: 480px) { .fields { grid-template-columns: minmax(0, 1fr) } }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; min-width: 0 }
label.f input, label.f select, label.f textarea { font-weight: 400; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); width: 100%; min-width: 0 }
label.f textarea { min-height: 70px; resize: vertical }
.hint { font-weight: 400; color: var(--muted); font-size: 12px }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px }
.inline { display: flex; gap: 8px } .inline > * { flex: 1; min-width: 0 }
.sheet footer { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-top: 18px }
.sheet footer .r { display: flex; gap: 8px; margin-left: auto }
.err { color: var(--over); font-size: 14px; margin-top: 10px }

dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0 0 16px }
dl.facts dt { color: var(--muted); font-size: 13px } dl.facts dd { margin: 0; overflow-wrap: anywhere }
dl.facts dd.pre { white-space: pre-line } dl.facts a { color: var(--accent) }
.sub { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 18px 0 8px; display: flex; justify-content: space-between; align-items: center }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 14px; z-index: 20 }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out } @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0 } } }
.datafoot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 13px }
.datafoot .actions { gap: 6px }
@media (max-width: 420px) { nav.tabs button { padding: 10px 7px; font-size: 15px } }
@media (max-width: 480px) { header.top .actions { width: 100% } header.top .actions .btn { flex: 1 1 auto; padding: 8px 10px; font-size: 14px } }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px }
.photos button { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: var(--sunk); cursor: pointer }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block }
.photos .missing img { visibility: hidden }
.photo-full { display: block; width: 100%; max-height: 65vh; object-fit: contain; border-radius: 8px; background: var(--sunk); margin-top: 8px }
.qr { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; margin: 8px 0 }
.qr svg { width: 180px; height: 180px; background: #fff; padding: 6px; border-radius: 6px }
.spend-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 12px 0 }
.spend-cards div { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--surface) }
.spend-cards b { display: block; font-size: 20px }
.spend-cards span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em }
.tbl-wrap { overflow-x: auto }
table.spend { width: 100%; border-collapse: collapse; font-size: 14px }
table.spend th, table.spend td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums }
table.spend th:first-child, table.spend td:first-child { text-align: left; white-space: normal }
table.spend th { color: var(--muted); font-weight: 600; font-size: 12px }
.log .entry .r { display: flex; gap: 6px }
#print-area { display: none }
@media print {
  body.printing { background: #fff }
  body.printing > *:not(#print-area) { display: none !important }
  body.printing #print-area { display: grid; grid-template-columns: repeat(3, 1fr); gap: .2in; color: #000 }
  body.printing #print-area.report { display: block; font: 10pt/1.35 sans-serif }
  .report h1 { font-size: 18pt; margin: 0 0 4px } .report h2 { font-size: 13pt; margin: 14px 0 6px; border-bottom: 1px solid #000 }
  .report small { font-weight: 400; color: #444 } .report span { color: #555 }
  .inv { display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px solid #ddd; break-inside: avoid }
  .inv img, .inv .nophoto { width: 1.1in; height: 1.1in; object-fit: cover; flex: none; border: 1px solid #ccc }
  .label { break-inside: avoid; border: 1px dashed #aaa; padding: .1in; text-align: center; font: 10pt sans-serif; display: flex; flex-direction: column; align-items: center; gap: 2px }
  .label svg { width: 1.5in; height: 1.5in }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Homebox</h1>
      <p>Equipment, tools and parts around the house, and the upkeep they need.</p>
    </div>
    <div class="actions">
      <button class="btn primary" data-act="new-task" id="btn-new-task">Add maintenance</button>
      <button class="btn primary" data-act="new-item" id="btn-new-item">Add equipment</button>
      <button class="btn primary" data-act="new-part" id="btn-new-part">Add parts &amp; supplies</button>
      <button class="btn primary" data-act="new-project" id="btn-new-project">Add project</button>
    </div>
  </header>

  <div class="strip" id="strip">
    <div><b id="s-items">–</b><span>Items</span></div>
    <div class="over"><b id="s-over">–</b><span>Overdue</span></div>
    <div class="soon"><b id="s-soon">–</b><span>Due in 30 days</span></div>
    <div><b id="s-warr">–</b><span>Warranties ending</span></div>
  </div>

  <div id="banner"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-upcoming" data-view="upcoming" aria-selected="true">Maintenance</button>
    <button role="tab" id="tab-items" data-view="items" aria-selected="false">Equipment</button>
    <button role="tab" id="tab-parts" data-view="parts" aria-selected="false">Parts &amp; supplies</button>
    <button role="tab" id="tab-projects" data-view="projects" aria-selected="false">Projects</button>
    <button role="tab" id="tab-spending" data-view="spending" aria-selected="false">Spending</button>
  </nav>

  <section id="view-upcoming"></section>
  <section id="view-items" hidden>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search brand, product, specs, parts…" aria-label="Search equipment">
      <select id="f-type" aria-label="Filter by type"><option value="">All types</option></select>
      <select id="f-loc" aria-label="Filter by location"><option value="">All locations</option></select>
      <button class="btn" data-act="print-labels" id="btn-print-labels">Print QR labels</button>
      <button class="btn" data-act="inventory" id="btn-inventory">Inventory report</button>
    </div>
    <div id="items-list"></div>
  </section>
  <section id="view-projects" hidden>
    <div class="toolbar">
      <input id="jq" type="search" placeholder="Search projects, steps, materials…" aria-label="Search projects">
      <select id="f-jstatus" aria-label="Filter by status"><option value="">All projects</option><option value="open">Not done yet</option><option value="Done">Done</option></select>
    </div>
    <div id="projects-list"></div>
  </section>
  <section id="view-parts" hidden>
    <div class="toolbar">
      <input id="pq" type="search" placeholder="Search name, size, part number, where it's kept…" aria-label="Search parts and supplies">
      <select id="f-pcat" aria-label="Filter by category"><option value="">All categories</option></select>
    </div>
    <div id="parts-list"></div>
  </section>

  <section id="view-spending" hidden>
    <div class="toolbar">
      <select id="f-syear" aria-label="Year"><option value="">All years</option></select>
    </div>
    <div id="spending-list"></div>
  </section>

  <footer class="datafoot" id="datafoot"></footer>
  <input type="file" id="restore-file" accept=".json,application/json" hidden>
  <input type="file" id="photo-file" accept="image/*" multiple hidden>
  <input type="file" id="doc-file" accept="application/pdf,.pdf,image/*" multiple hidden>
</div>

<div id="print-area"></div>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<datalist id="dl-types"></datalist>
<datalist id="dl-locs"></datalist>
<datalist id="dl-tasks"></datalist>
<datalist id="dl-pcats"></datalist>
<datalist id="dl-units"></datalist>

<script src="qrcode.js"></script>
<script>
const DEFAULT_TYPES = ["Appliance", "HVAC", "Plumbing", "Electrical", "Power tool", "Hand tool", "Yard & garden", "Vehicle", "Electronics", "Part / supply"];
const DEFAULT_LOCS = ["Basement", "Garage", "Kitchen", "Laundry room", "Utility closet", "Attic", "Shed", "Yard"];
const PART_CATS = ["Plumbing", "Electrical", "HVAC", "Fasteners", "Appliance parts", "Lighting", "Paint & finish", "Lumber & building", "Yard & garden", "Other"];
const PART_UNITS = ["pcs", "ft", "box", "pack", "roll", "gal", "lb"];
const LIFESPAN_HINT = "Typical: water heater 8–12, furnace 15–20, central AC 10–15, washer or dryer 10–13, fridge 10–15, dishwasher 9–12, roof 20–30.";
const TASK_IDEAS = ["Replace furnace filter", "Oil blower motor", "Winterize", "Clean dryer vent", "Flush water heater", "Test smoke & CO detectors", "Service lawn mower", "Clean gutters", "Replace fridge water filter", "Sharpen blades"];
const UNITS = { days: "day", weeks: "week", months: "month", years: "year" };
const RRULE = { days: "DAILY", weeks: "WEEKLY", months: "MONTHLY", years: "YEARLY" };

const S = { items: [], tasks: [], parts: [], projects: [], view: "upcoming", db: null, dl: null, loaded: { items: false, tasks: false } };
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- dates (all stored as YYYY-MM-DD, local) ---------- */
const pad = (n) => String(n).padStart(2, "0");
const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => fmt(new Date());
const daysUntil = (s) => Math.round((parse(s) - parse(today())) / 86400000);
function addInterval(s, n, unit) {
  const d = parse(s); n = Number(n) || 0;
  if (unit === "days") d.setDate(d.getDate() + n);
  else if (unit === "weeks") d.setDate(d.getDate() + 7 * n);
  else {
    const months = unit === "years" ? 12 * n : n, day = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + months);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  }
  return fmt(d);
}
const nice = (s) => s ? parse(s).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
const every = (t) => `Every ${Number(t.every) === 1 ? "" : t.every + " "}${UNITS[t.unit] || "month"}${Number(t.every) === 1 ? "" : "s"}`;
function rel(s) {
  const n = daysUntil(s);
  if (n === 0) return "due today";
  if (n < 0) return `${-n} day${n === -1 ? "" : "s"} overdue`;
  if (n === 1) return "due tomorrow";
  if (n < 45) return `in ${n} days`;
  return nice(s);
}
const dueClass = (s) => { const n = daysUntil(s); return n < 0 ? "over" : n <= 30 ? "soon" : "ok"; };

function warranty(it) {
  if (!it.warrantyEnd) return { cls: "none", text: "No warranty info" };
  const n = daysUntil(it.warrantyEnd);
  if (n < 0) return { cls: "none", text: "Warranty expired" };
  if (n <= 90) return { cls: "soon", text: `Warranty ends in ${n} day${n === 1 ? "" : "s"}` };
  return { cls: "ok", text: `Warranty to ${parse(it.warrantyEnd).toLocaleDateString(undefined, { month: "short", year: "numeric" })}` };
}
function lifespan(it) {
  const start = it.installDate || it.purchaseDate, yrs = Number(it.lifespan);
  if (!start || !yrs) return null;
  const age = (parse(today()) - parse(start)) / (365.25 * 86400000), left = yrs - age, whole = Math.floor(age);
  const ageText = age < 1 ? "Under 1 yr old" : `${whole} yr${whole === 1 ? "" : "s"} old`;
  if (left <= 0) return { cls: "over", text: "Past expected life", ageText, yrs };
  const l = Math.max(1, Math.round(left));
  if (age >= yrs * 0.8 || left <= 2) return { cls: "soon", text: `Near end of life (~${l} yr${l === 1 ? "" : "s"} left)`, ageText, yrs };
  return { cls: "ok", text: `~${l} yrs of life left`, ageText, yrs };
}
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";
const linkText = (u) => u.replace(/^https?:\/\/(www\.)?/i, "").slice(0, 60);
const itemName = (it) => [it.brand, it.product].filter(Boolean).join(" ") || "Untitled item";
const itemById = (id) => S.items.find((i) => i.id === id);

/* ---------- rendering ---------- */
function render() {
  const ready = S.loaded.items && S.loaded.tasks;
  const over = S.tasks.filter((t) => t.nextDue && daysUntil(t.nextDue) < 0).length;
  const soon = S.tasks.filter((t) => t.nextDue && daysUntil(t.nextDue) >= 0 && daysUntil(t.nextDue) <= 30).length;
  const warr = S.items.filter((i) => warranty(i).cls === "soon").length;
  $("s-items").textContent = ready ? S.items.length : "–";
  $("s-over").textContent = ready ? over : "–";
  $("s-soon").textContent = ready ? soon : "–";
  $("s-warr").textContent = ready ? warr : "–";

  const examples = S.items.some((i) => i.example) || S.tasks.some((t) => t.example) || S.parts.some((x) => x.example) || S.projects.some((x) => x.example);
  const real = S.items.filter((i) => !i.example).length + S.tasks.filter((t) => !t.example).length;
  const m = meta(), last = m.lastBackup, mode = SRV.on ? "" : m.fileMode || "";
  const stale = !SRV.on && !mode && real >= 3 && (!last || daysUntil(last) < -30);
  const unsaved = mode === "manual" && localSig() !== m.savedSig;
  let fileNotice = "";
  if (mode === "auto" && FILE.status === "needs-permission") fileNotice = `<div class="notice"><span>Homebox saves to <b>${esc(m.fileName || "your data file")}</b>. Click Reconnect so it can keep saving there.</span><button class="btn small primary" data-act="fs-reconnect" id="btn-fs-reconnect">Reconnect</button></div>`;
  if (mode === "auto" && FILE.status === "error") fileNotice = `<div class="notice"><span>Couldn't save to <b>${esc(m.fileName || "your data file")}</b>. It may have been moved, renamed or deleted. Your changes are still safe in this browser.</span><button class="btn small primary" data-act="fs-create" id="btn-fs-again">Choose where to save</button></div>`;
  if (unsaved) fileNotice = `<div class="notice"><span>You have changes that aren't in your data file yet.</span><button class="btn small primary" data-act="file-save" id="btn-file-save-nudge">Save to file</button></div>`;
  const hp = SRV.on && SRV.status === "connected" ? healthProblems(SRV.health) : [];
  if (hp.length) fileNotice = `<div class="notice"><span>${esc(hp[0])}</span><button class="btn small" data-act="srv-health" id="btn-srv-health-nudge">Server status</button></div>`;
  if (SRV.on && SRV.status === "signed-out") fileNotice = `<div class="notice"><span>Sign in to save to your home server. Until then, changes stay in this browser only.</span><button class="btn small primary" data-act="srv-signin" id="btn-srv-signin-nudge">Sign in</button></div>`;
  $("banner").innerHTML = (examples ? `<div class="notice"><span>The entries marked <span class="ex">Example</span> are samples to show how Homebox works.</span><button class="btn small" data-act="clear-examples" id="btn-clear-ex">Remove examples</button></div>` : "")
    + fileNotice
    + (stale ? `<div class="notice"><span>${last ? `Your last backup was ${esc(nice(last))}.` : "You haven't backed up yet."} Homebox lives only in this browser, so keep a copy somewhere safe.</span><button class="btn small primary" data-act="backup" id="btn-backup-nudge">Download backup</button></div>` : "");
  renderDataFoot({ ...m, fileMode: mode }, unsaved);

  fillLists();
  renderUpcoming(ready);
  renderItems(ready);
  renderParts(ready);
  renderProjects(ready);
  renderSpending(ready);
}

function fillLists() {
  const types = [...new Set([...S.items.map((i) => i.type).filter(Boolean), ...DEFAULT_TYPES])];
  const locs = [...new Set([...S.items.map((i) => i.location).filter(Boolean), ...DEFAULT_LOCS])];
  $("dl-types").innerHTML = types.map((t) => `<option value="${esc(t)}">`).join("");
  $("dl-locs").innerHTML = locs.map((t) => `<option value="${esc(t)}">`).join("");
  $("dl-tasks").innerHTML = TASK_IDEAS.map((t) => `<option value="${esc(t)}">`).join("");
  const pcats = [...new Set([...S.parts.map((x) => x.category).filter(Boolean), ...PART_CATS])];
  $("dl-pcats").innerHTML = pcats.map((t) => `<option value="${esc(t)}">`).join("");
  $("dl-units").innerHTML = PART_UNITS.map((t) => `<option value="${esc(t)}">`).join("");
  const usedCats = [...new Set(S.parts.map((x) => x.category).filter(Boolean))].sort();
  { const sel = $("f-pcat"), cur = sel.value; sel.innerHTML = `<option value="">All categories</option>` + usedCats.map((v) => `<option${v === cur ? " selected" : ""}>${esc(v)}</option>`).join(""); }
  const usedTypes = [...new Set(S.items.map((i) => i.type).filter(Boolean))].sort();

  for (const [sel, vals, all] of [[$("f-type"), usedTypes, "All types"], [$("f-loc"), usedLocs, "All locations"]]) {

}

function renderUpcoming(ready) {
  const el = $("view-upcoming");

  if (!S.tasks.length) {
    el.innerHTML = `<div class="empty" style="margin-top:16px"><strong>No maintenance scheduled yet</strong>Add a recurring task, like a filter change every 3 months or winterizing every October.<br><br><button class="btn primary" data-act="new-task" id="btn-empty-task">Add maintenance</button></div>`;
    return;
  }
  const sorted = [...S.tasks].sort((a, b) => (a.nextDue || "").localeCompare(b.nextDue || ""));
  const groups = [
    ["Overdue", sorted.filter((t) => daysUntil(t.nextDue) < 0)],
    ["Next 30 days", sorted.filter((t) => { const n = daysUntil(t.nextDue); return n >= 0 && n <= 30; })],
    ["Later", sorted.filter((t) => daysUntil(t.nextDue) > 30)],

  el.innerHTML = groups.filter(([, l]) => l.length).map(([h, l]) =>
    `<div class="group"><h3>${h} · ${l.length}</h3><div class="list">${l.map((t) => taskRow(t)).join("")}</div></div>`).join("");
}

/* ---------- projects ---------- */
const PJ_STATUS = ["In progress", "Planned", "Idea", "On hold", "Done"];
const PJ_PRI = ["High", "Medium", "Low"];
const projById = (id) => S.projects.find((x) => x.id === id);
const money = (v) => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
const fmtMoney = (n) => n.toLocaleString(undefined, { style: "currency", currency: "USD", minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
const projSpent = (pj) => (pj.log || []).reduce((sum, x) => sum + money(x.cost), 0);
const priClass = (pr) => pr === "High" ? "over" : pr === "Medium" ? "soon" : "none";
function projMoney(pj) {
  const spent = projSpent(pj), budget = money(pj.budget);
  if (!budget && !spent) return null;
  if (!budget) return { cls: "", text: `Spent ${fmtMoney(spent)}` };
  return { cls: spent > budget ? "txt-over" : "", text: `Spent ${fmtMoney(spent)} of ${fmtMoney(budget)}` };
}
function projDue(pj) {
  if (!pj.target || pj.status === "Done") return null;
  const n = daysUntil(pj.target);
  if (n < 0) return { cls: "txt-over", text: `${-n} day${n === -1 ? "" : "s"} past target` };
  return { cls: n <= 14 ? "txt-soon" : "", text: `Target ${nice(pj.target)}` };
}

function renderProjects(ready) {
  const el = $("projects-list");
  if (!ready) { el.innerHTML = ""; return; }
  if (!S.projects.length) {
    el.innerHTML = `<div class="empty"><strong>No projects yet</strong>Plan bigger jobs here, like finishing the basement or replacing a fence: the steps, what to buy, the budget and how it's going.<br><br><button class="btn primary" data-act="new-project" id="btn-empty-project">Add project</button></div>`;
    return;
  }
  const q = $("jq").value.trim().toLowerCase(), fs = $("f-jstatus").value;
  const list = S.projects
    .filter((x) => !fs || (fs === "open" ? x.status !== "Done" : x.status === fs))
    .filter((x) => !q || [x.name, x.area, x.description, x.notes, x.who, ...(x.steps || []).map((s) => s.text), ...(x.materials || []).map((s) => s.text)].join(" ").toLowerCase().includes(q));
  if (!list.length) { el.innerHTML = `<div class="empty">No projects match that search.</div>`; return; }
  const row = (x) => {
    const steps = x.steps || [], due = projDue(x), m = projMoney(x);
    const stripe = due?.cls === "txt-over" ? "over" : x.status === "In progress" ? "soon" : x.status === "Done" ? "ok" : "";
    return `<div class="row clickable ${stripe}" data-act="open-project" data-id="${x.id}" tabindex="0" role="button">
      <span class="stripe"></span>
      <div class="main">
        <div class="title">${esc(x.name || "Untitled project")}${x.example ? '<span class="ex">Example</span>' : ""}</div>
        <div class="meta">
          ${x.area ? `<span class="chip">${esc(x.area)}</span>` : ""}
          ${steps.length ? `<span>${steps.filter((s) => s.done).length} of ${steps.length} steps done</span>` : ""}
          ${due ? `<span class="${due.cls}">${esc(due.text)}</span>` : ""}
          ${x.status === "Done" && x.finished ? `<span>Finished ${esc(nice(x.finished))}</span>` : ""}
          ${m ? `<span class="${m.cls}">${esc(m.text)}</span>` : ""}
        </div>
      </div>
      <div class="side">${x.priority && x.status !== "Done" ? `<span class="pill ${priClass(x.priority)}">${esc(x.priority)} priority</span>` : ""}</div>
    </div>`;
  };
  const rank = (x) => PJ_PRI.indexOf(x.priority) < 0 ? 9 : PJ_PRI.indexOf(x.priority);
  el.innerHTML = PJ_STATUS.map((st) => {
    const g = list.filter((x) => (PJ_STATUS.includes(x.status) ? x.status : "Idea") === st)
      .sort((a, b) => st === "Done" ? (b.finished || "").localeCompare(a.finished || "") : rank(a) - rank(b) || (a.target || "9").localeCompare(b.target || "9"));
    return g.length ? `<div class="group"><h3>${st} · ${g.length}</h3><div class="list">${g.map(row).join("")}</div></div>` : "";
  }).join("");
}

/* ---------- calendar link (Google Calendar, repeating all-day event) ---------- */
function calLink(t) {
  const it = itemById(t.itemId);
  const start = t.nextDue.replace(/-/g, ""), end = addInterval(t.nextDue, 1, "days").replace(/-/g, "");
  const details = [it ? `For: ${itemName(it)}${it.location ? " (" + it.location + ")" : ""}` : "", t.notes || "", "From Homebox"].filter(Boolean).join("\n");
  const p = new URLSearchParams({ action: "TEMPLATE", text: t.title, dates: `${start}/${end}`, details,
    recur: `RRULE:FREQ=${RRULE[t.unit] || "MONTHLY"};INTERVAL=${Math.max(1, Number(t.every) || 1)}` });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

/* ---------- writes ---------- */
function toast(msg) { document.querySelectorAll(".toast").forEach((x) => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
async function write(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const msg = "Couldn't save. Your browser's storage may be full, or blocked in private browsing.";
    const err = $("form-err"); if (err && dlg.open) { err.textContent = msg; err.hidden = false; } else toast(msg);
    return false;
  }
}
const formData = (f) => Object.fromEntries([...new FormData(f).entries()].map(([k, v]) => [k, String(v).trim()]));

document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, id = f.dataset.id;
  if (f.id === "srv-auth") return srvAuthSubmit(f);
  if (!S.db) return;
  if (f.id === "item-form") {
    const d = formData(f);
    const ref = id ? S.db.doc("items/" + id) : S.db.collection("items").doc();
    const prev = id ? itemById(id) : null;
    const body = { ...(prev || {}), ...d, createdAt: prev?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
    delete body.id;
    if (await write(() => ref.set(body), id ? "Equipment updated" : "Equipment added")) itemSheet(ref.id);
  }
  if (f.id === "log-form") {
    const d = formData(f), col = f.dataset.col, ownerId = f.dataset.owner, it = col === "projects" ? projById(ownerId) : itemById(ownerId); if (!it) return closeSheet();
    const lid = f.dataset.log || newId();
    const log = (it.log || []).filter((x) => x.id !== lid).concat({ id: lid, date: d.date, what: d.what, cost: d.cost, by: d.by });
    if (await write(() => S.db.doc(col + "/" + ownerId).update({ log }), f.dataset.log ? "Entry updated" : "Entry added")) backToOwner();
  }
  if (f.id === "project-form") {
    const d = formData(f), prev = id ? projById(id) : null;
    delete d.itemIds;
    const body = { ...(prev || {}), ...d, itemIds: new FormData(f).getAll("itemIds"), updatedAt: new Date().toISOString() };
    body.finished = body.status === "Done" ? (prev?.finished || today()) : "";
    if (!prev) { body.steps = []; body.materials = []; body.log = []; body.createdAt = body.updatedAt; }
    delete body.id;
    const ref = id ? S.db.doc("projects/" + id) : S.db.collection("projects").doc();
    if (await write(() => ref.set(body), id ? "Project updated" : "Project added")) projectSheet(ref.id);
  }
  if (f.classList.contains("pj-add")) {
    const pid = f.closest("[data-project]")?.dataset.project, pj = projById(pid), key = f.dataset.list;
    const text = f.elements.text.value.trim(); if (!pj || !text) return;
    const arr = [...(pj[key] || []), { id: newId(), text, done: false }];
    if (await write(() => S.db.doc("projects/" + pid).update({ [key]: arr }))) projectSheet(pid, "#add-" + key);
    return;
  }
  if (f.id === "part-form") {
    const d = formData(f), prev = id ? S.parts.find((x) => x.id === id) : null;
    const body = { ...(prev || {}), ...d, updatedAt: new Date().toISOString() };
    delete body.id;
    const ref = id ? S.db.doc("parts/" + id) : S.db.collection("parts").doc();
    const back = sheet.dataset.back;
    if (await write(() => ref.set(body), id ? "Part updated" : "Part added")) { if (back) itemSheet(back); else closeSheet(); }
  }
  if (f.id === "task-form") {
    const d = formData(f);
    const prev = id ? S.tasks.find((t) => t.id === id) : null;
    const body = { ...(prev || {}), ...d, every: Math.max(1, parseInt(d.every, 10) || 1) };
    delete body.id;
    const ref = id ? S.db.doc("tasks/" + id) : S.db.collection("tasks").doc();
    const back = sheet.dataset.back;
    if (await write(() => ref.set(body), id ? "Maintenance updated" : "Maintenance added")) {
      if (back) itemSheet(back); else closeSheet();
    }
  }
});

let armed = null;
function arm(btn, label) {
  if (armed === btn) return true;
  if (!matchMedia("(pointer: coarse)").matches) label = label.replace(/\bTap\b/, "Click");
  if (armed) { armed.classList.remove("armed"); armed.textContent = armed.dataset.label; }
  btn.dataset.label = btn.textContent; btn.textContent = label; btn.classList.add("armed"); armed = btn;
  return false;
}

document.addEventListener("click", async (e) => {
  const tab = e.target.closest("[data-view]");
  if (tab) { S.view = tab.dataset.view; for (const b of document.querySelectorAll("[data-view]")) b.setAttribute("aria-selected", b === tab); for (const v of ["upcoming", "items", "parts", "projects", "spending"]) $("view-" + v).hidden = S.view !== v; return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (armed && armed !== el) { armed.classList.remove("armed"); armed.textContent = armed.dataset.label; armed = null; }
  const inItem = el.closest("[data-item]")?.dataset.item;
  switch (act) {
    case "close": return closeSheet();
    case "new-item": sheet.dataset.back = ""; return itemForm();
    case "edit-item": sheet.dataset.back = ""; return itemForm(itemById(id));
    case "open-item": sheet.dataset.back = ""; return itemSheet(id);
    case "new-task": sheet.dataset.back = el.dataset.item || ""; return taskForm({}, el.dataset.item || "");
    case "edit-task": { const back = inItem || ""; const t = S.tasks.find((x) => x.id === id); sheet.dataset.back = back; return t && taskForm(t); }
    case "new-log": return el.dataset.project ? logForm(el.dataset.project, {}, "projects") : logForm(el.dataset.item);
    case "edit-log": {
      const inProj = el.closest("[data-project]")?.dataset.project;
      const owner = inProj ? projById(inProj) : itemById(inItem);
      const x = owner && (owner.log || []).find((l) => l.id === el.dataset.log);
      return x && logForm(owner.id, x, inProj ? "projects" : "items");
    }
    case "back-item": return backToOwner();
    case "del-log": {
      if (!arm(el, "Tap again to delete")) return;
      armed = null;
      const f = $("log-form"), col = f.dataset.col, ownerId = f.dataset.owner, it = col === "projects" ? projById(ownerId) : itemById(ownerId);
      if (it && await write(() => S.db.doc(col + "/" + ownerId).update({ log: (it.log || []).filter((x) => x.id !== f.dataset.log) }), "Entry deleted")) backToOwner();
      return;
    }
    case "new-project": return projectForm();
    case "open-project": return projectSheet(id);

const onCommit = [];

const stable = (v) => Array.isArray(v) ? `[${v.map(stable).join(",")}]` : v && typeof v === "object" ? `{${Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + stable(v[k])).join(",")}}` : JSON.stringify(v ?? null);

}

// Remember the chosen file between visits (Chrome/Edge store file handles in IndexedDB).
function kv(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open("homebox", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onerror = () => rej(r.error);
    r.onsuccess = () => { const t = r.result.transaction("kv", mode); const q = fn(t.objectStore("kv")); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); };
  });
}
const fsRemember = (h) => kv("readwrite", (s) => s.put(h, "handle")).catch(() => {});
const fsForget = () => kv("readwrite", (s) => s.delete("handle")).catch(() => {});
const fsRecall = () => kv("readonly", (s) => s.get("handle")).catch(() => null);

function fsFail(e) {

}
async function fsWriteNow() {
  if (!FILE.handle) return;
  try {
    const w = await FILE.handle.createWritable();
    await w.write(snapshot()); await w.close();
    FILE.status = "connected"; FILE.savedAt = new Date();
    setMeta({ savedSig: localSig(), lastBackup: today() });
  } catch (e) { FILE.status = e?.name === "NotAllowedError" ? "needs-permission" : "error"; }
  render();
}
function fsScheduleWrite() {
  if (meta().fileMode !== "auto" || FILE.status !== "connected") return;
  clearTimeout(FILE.timer);
  FILE.timer = setTimeout(() => { FILE.timer = null; FILE.queue = FILE.queue.then(fsWriteNow); }, 400);
}
onCommit.push(fsScheduleWrite);

async function fsUse(handle) {

  await fsRemember(handle);
}
async function fsCreate() {

async function fsOpen() {

  const data = parseHomebox(await (await h.getFile()).text());

}
async function fsReconnect() {

}
let fsPendingFile = null;
// Reconcile the file with this browser. savedSig is the last state both agreed on.
async function fsSync() {

  let data;

  catch (e) { FILE.status = e?.name === "NotAllowedError" ? "needs-permission" : "error"; return render(); }

  else if (fs === base) { await fsWriteNow(); }
  else {
    fsPendingFile = data; sheet.dataset.back = "";
    openSheet(`<div><h2>Two different versions</h2>
      <p><b>${esc(FILE.handle.name)}</b> was changed somewhere else, maybe on another computer, and Homebox in this browser has changes too.</p>
      <p>Choose which version to keep. The other one is replaced.</p>
      <footer><div class="r"><button class="btn" data-act="fs-use-local" id="btn-fs-local">Keep this browser's version</button><button class="btn primary" data-act="fs-use-file" id="btn-fs-file">Use the file's version</button></div></footer></div>`);
  }

}

  else await fsWriteNow();

/* ---------- home server ---------- */
// When Homebox is served by server/server.js, everything is also saved on that server so all
// devices share one copy. On GitHub Pages or from a file there is no /api, so this stays off.
// meta.serverVersion/serverSig record the last state this browser and the server agreed on.
const TOKEN_KEY = "homebox:server-token";
const SRV = { on: false, status: "off", timer: null, inflight: 0, queue: Promise.resolve(), pending: null, lastSync: null };
const srvToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } };
function srvSetToken(t) { try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch {} }
async function srvFetch(route, opts = {}) {
  const t = srvToken();

  let body = null; try { body = await res.json(); } catch {}

// One server call at a time, so pulls and pushes never cross.
function srvRun(fn) {
  SRV.inflight++;

  SRV.queue = run;
  return run;
}
const dataOnly = (r = localDb.raw()) => ({ items: r.items || {}, tasks: r.tasks || {}, parts: r.parts || {}, projects: r.projects || {} });
const onlyExamples = (d) => Object.values(d).every((col) => Object.values(col).every((x) => x && x.example));

async function srvInit() {

  catch { if (meta().serverMode) { SRV.on = true; SRV.status = "offline"; } return; }

  if (!r.body.configured) { SRV.status = "signed-out"; return srvAuthSheet("setup"); }

    <div class="fields">

}
async function srvAuthSubmit(f) {
  const d = formData(f), err = $("form-err"), setup = f.dataset.mode === "setup";
  const fail = (msg) => { err.textContent = msg; err.hidden = false; };
  if (setup && d.password.length < 8) return fail("Use at least 8 characters.");
  if (setup && d.password !== d.confirm) return fail("The two passwords don't match.");
  const btn = $("btn-srv-auth"); btn.disabled = true;
  try {
    const r = await srvFetch(setup ? "setup" : "login", { method: "POST", body: JSON.stringify({ password: d.password, device: deviceName() }) });
    if (r.status !== 200) return fail(r.body?.error || "That didn't work. Try again.");
    srvSetToken(r.body.token); closeSheet();
    toast(setup ? "Password set. Saving to your home server." : "Signed in");
    await srvPull();

  } catch { fail("Can't reach your home server right now."); }
  finally { btn.disabled = false; }
}
async function srvSignOut() {
  await srvFetch("logout", { method: "POST" }).catch(() => {});
  srvSetToken(""); SRV.status = "signed-out"; render();
  toast("Signed out. This browser keeps its copy but stops syncing.");
}

const srvPull = () => SRV.on && !SRV.pending && !SRV.timer ? srvRun(async () => {
  const r = await srvFetch("data");
  if (r.status === 401) return srvSignedOut();
  if (r.status !== 200) throw new Error();
  SRV.status = "connected"; SRV.lastSync = new Date();
  await srvReconcile(r.body);
}) : undefined;

async function srvReconcile(doc) {
  const m = meta(), local = dataOnly(), ls = sigOf(local), ss = sigOf(doc.data);
  if (ss === ls) return setMeta({ serverVersion: doc.version, serverSig: ls });
  if (doc.version === 0) { setMeta({ serverVersion: 0 }); return srvPushNow(true); }
  const localChanged = ls !== m.serverSig;
  if (!localChanged || (m.serverVersion == null && onlyExamples(local))) return srvApply(doc, m.serverVersion != null);
  if (doc.version === m.serverVersion) return srvPushNow();
  srvConflict(doc);
}
async function srvApply(doc, announce) {
  SRV.applying = true;
  try { await localDb.replace(doc.data); } finally { SRV.applying = false; }
  setMeta({ serverVersion: doc.version, serverSig: localSig() });
  if (announce) toast("Updated with changes from another device");
}
async function srvPushNow(force) {
  const data = dataOnly(), sig = sigOf(data), m = meta();
  if (!force && sig === m.serverSig) return;
  const r = await srvFetch("data", { method: "PUT", body: JSON.stringify({ baseVersion: m.serverVersion || 0, data }) });
  if (r.status === 401) return srvSignedOut();
  if (r.status === 409 && r.body) return srvReconcile(r.body);
  if (r.status !== 200) throw new Error();
  setMeta({ serverVersion: r.body.version, serverSig: sig });
  SRV.status = "connected"; SRV.lastSync = new Date();
}
function srvSchedule() {
  if (!SRV.on || SRV.applying || SRV.pending || SRV.status === "signed-out") return;
  clearTimeout(SRV.timer);
  SRV.timer = setTimeout(() => { SRV.timer = null; srvRun(() => srvPushNow()); }, 600);
}
onCommit.push(srvSchedule);

function srvConflict(doc) {
  SRV.pending = doc; sheet.dataset.back = "";
  openSheet(`<div><h2>Two different versions</h2>
    <p>Homebox on your home server was changed on another device${doc.updatedAt ? ` (${esc(new Date(doc.updatedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }))})` : ""}, and this browser has changes that aren't on the server yet.</p>
    <p>Choose which version to keep. The other one is replaced. A daily copy of the server's data is kept on the server either way.</p>
    <footer><div class="r"><button class="btn" data-act="srv-use-local" id="btn-srv-local">Keep this device's version</button><button class="btn primary" data-act="srv-use-server" id="btn-srv-server">Use the server's version</button></div></footer></div>`, null);
}
function srvResolve(which) {
  const doc = SRV.pending; SRV.pending = null; closeSheet();
  if (!doc) return;
  if (which === "server") return srvRun(() => srvApply(doc, false));
  setMeta({ serverVersion: doc.version });
  return srvRun(() => srvPushNow(true));
}
setInterval(() => { if (!document.hidden) srvPull(); }, 30000);

/* ---------- photos (home server only) and QR labels ---------- */
const PHOTO_URLS = new Map();
async function photoUrl(id) {
  if (PHOTO_URLS.has(id)) return PHOTO_URLS.get(id);
  const res = await fetch("api/photo?id=" + encodeURIComponent(id), { headers: { Authorization: "Bearer " + srvToken() } });
  if (!res.ok) throw new Error();
  const url = URL.createObjectURL(await res.blob());
  PHOTO_URLS.set(id, url);
  return url;
}
function hydratePhotos(root) {
  for (const img of root.querySelectorAll("img[data-photo]")) {
    photoUrl(img.dataset.photo).then((u) => { img.src = u; }).catch(() => { img.alt = "Photo not available right now"; img.parentElement.classList.add("missing"); });
  }
}
// Phone photos are often 5+ MB; shrink them before upload.
function shrinkImage(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => b ? resolve(b) : reject(new Error()), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error()); };
    img.src = url;
  });
}
async function addPhotos(itemId, files) {
  if (!SRV.on || SRV.status === "signed-out") return srvSignedOut();
  if (files.length > 1) toast(`Adding ${files.length} photos…`);
  let added = 0;
  for (const f of files) {
    try {
      const blob = await shrinkImage(f);
      const res = await fetch("api/photo", { method: "POST", headers: { "Content-Type": "image/jpeg", Authorization: "Bearer " + srvToken() }, body: blob });
      if (res.status === 401) { srvSignedOut(); break; }
      const body = await res.json();
      if (!res.ok) throw new Error(body.error);
      PHOTO_URLS.set(body.id, URL.createObjectURL(blob));
      const it = itemById(itemId); if (!it) break;
      await S.db.doc("items/" + itemId).update({ photos: [...(it.photos || []), { id: body.id, added: today() }] });
      added++;
    } catch { toast(SRV.status === "offline" ? "Photos need a connection to your home server." : `Couldn't add ${f.name || "that photo"}.`); }
  }
  if (added) toast(added === 1 ? "Photo added" : `${added} photos added`);
}
$("photo-file").addEventListener("change", (e) => {
  const files = [...e.target.files]; e.target.value = "";
  if (files.length && S.photoItem) addPhotos(S.photoItem, files);
});

  const it = itemById(itemId), p = (it?.photos || []).find((x) => x.id === photoId);
  if (!p) return itemSheet(itemId);
  openSheet(`<div data-photo-view="${esc(photoId)}">

    <footer><button type="button" class="btn danger" data-act="del-photo" data-id="${esc(itemId)}" data-photo="${esc(photoId)}">Delete photo</button>
      <div class="r"><button class="btn" data-act="open-item" data-id="${esc(itemId)}">Back</button></div></footer>
  </div>`, null);
  hydratePhotos(sheet);
}

/* ---------- manuals and documents (home server only) ---------- */
const DOC_MAX = 25 * 1024 * 1024;
async function uploadBlob(blob, type) {
  const res = await fetch("api/photo", { method: "POST", headers: { "Content-Type": type, Authorization: "Bearer " + srvToken() }, body: blob });
  if (res.status === 401) { srvSignedOut(); throw new Error("signed out"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || "upload failed");
  return body;
}
async function addDocs(itemId, files) {
  if (!SRV.on || SRV.status === "signed-out") return srvSignedOut();
  if (files.length > 1) toast(`Adding ${files.length} files…`);
  let added = 0;
  for (const f of files) {
    try {
      const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
      if (isPdf && f.size > DOC_MAX) { toast(`${f.name} is over 25 MB.`); continue; }
      const up = isPdf ? await uploadBlob(f, "application/pdf") : await uploadBlob(await shrinkImage(f, 2400), "image/jpeg");
      const it = itemById(itemId); if (!it) break;
      await S.db.doc("items/" + itemId).update({ docs: [...(it.docs || []), { id: up.id, key: up.key, name: f.name || "Document", type: isPdf ? "pdf" : "image", added: today() }] });
      added++;
    } catch (e) { if (e.message !== "signed out") toast(SRV.status === "offline" ? "Files need a connection to your home server." : `Couldn't add ${f.name || "that file"}.`); }
  }
  if (added) toast(added === 1 ? "File added" : `${added} files added`);
}
$("doc-file").addEventListener("change", (e) => {

}

/* ---------- spending summary ---------- */
function spendEntries() {
  const out = [];
  for (const it of S.items) {
    const area = it.location || "No location";
    if (money(it.price)) out.push({ date: it.purchaseDate || "", amount: money(it.price), kind: "buy", what: "Bought " + itemName(it), itemId: it.id, area });
    for (const l of it.log || []) if (money(l.cost)) out.push({ date: l.date || "", amount: money(l.cost), kind: "fix", what: `${l.what} · ${itemName(it)}`, itemId: it.id, area });
  }
  for (const pj of S.projects) for (const l of pj.log || []) if (money(l.cost)) out.push({ date: l.date || "", amount: money(l.cost), kind: "proj", what: `${l.what} · ${pj.name}`, projectId: pj.id, area: pj.area || "No location" });
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
const SPEND_KINDS = { buy: "Purchases", fix: "Repairs & service", proj: "Projects" };
function renderSpending(ready) {
  const box = $("spending-list"); if (!box) return;
  if (!ready) { box.innerHTML = ""; return; }

  const years = [...new Set(all.map((e) => e.date.slice(0, 4) || "Undated"))].sort().reverse();
  const sel = $("f-syear"), cur = sel.value;
  sel.innerHTML = `<option value="">All years</option>` + years.map((y) => `<option${y === cur ? " selected" : ""}>${esc(y)}</option>`).join("");

  const by = (key) => { const m = new Map(); for (const e of list) { const k = key(e); if (!m.has(k)) m.set(k, { buy: 0, fix: 0, proj: 0 }); m.get(k)[e.kind] += e.amount; } return m; };
  const table = (title, first, m, sortRows) => {

    rows.sort(sortRows || ((a, b) => b[2] - a[2]));
    return `<h3 class="grp">${title}</h3><div class="tbl-wrap"><table class="spend"><thead><tr><th>${first}</th><th>Purchases</th><th>Repairs &amp; service</th><th>Projects</th><th>Total</th></tr></thead><tbody>
      ${rows.map(([k, v, t]) => `<tr><td>${k}</td>${["buy", "fix", "proj"].map((x) => `<td>${v[x] ? esc(fmtMoney(v[x])) : "–"}</td>`).join("")}<td><b>${esc(fmtMoney(t))}</b></td></tr>`).join("")}</tbody></table></div>`;
  };
  const itemLabel = (e) => e.itemId ? `<button class="btn link" data-act="open-item" data-id="${esc(e.itemId)}">${esc(itemName(itemById(e.itemId) || {}))}</button>` : `<button class="btn link" data-act="open-project" data-id="${esc(e.projectId)}">${esc(S.projects.find((p) => p.id === e.projectId)?.name || "Project")}</button>`;
  const byThing = new Map();

  box.innerHTML = `<div class="spend-cards">

    </div>

    ${table("By equipment and project", "What", new Map([...byThing.values()].slice(0, 200).map(({ e, v }) => [itemLabel(e), v])))}
    ${table("By area of the house", "Area", by((e) => esc(e.area)))}
    <h3 class="grp">${year ? "Everything in " + esc(year) : "Most recent"}</h3>
    <div class="log">${(year ? list : list.slice(0, 20)).map((e) => `<div class="entry"><span class="due">${esc(e.date ? nice(e.date) : "No date")}</span><span class="what">${esc(e.what)}<br><span class="sm">${SPEND_KINDS[e.kind]}</span></span><b>${esc(fmtMoney(e.amount))}</b></div>`).join("")}</div>`;
}

/* ---------- server status ---------- */
const GB = (n) => (n / 1024 ** 3).toFixed(n < 10 * 1024 ** 3 ? 1 : 0) + " GB";
const ago = (iso) => { const h = (Date.now() - new Date(iso)) / 36e5; return h < 1 ? "less than an hour ago" : h < 36 ? `${Math.round(h)} hours ago` : `${Math.round(h / 24)} days ago`; };

      ${h.disk ? `<dt>Disk</dt><dd>${GB(h.disk.free)} free of ${GB(h.disk.total)}</dd>` : ""}
      <dt>Server's daily copy</dt><dd>${h.serverBackup ? esc(nice(h.serverBackup)) : "None yet"}</dd>
      <dt>Backup on your PC</dt><dd>${h.offsiteBackup ? esc(new Date(h.offsiteBackup).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })) + ` (${ago(h.offsiteBackup)})` : "None yet"}</dd>
      <dt>Photos &amp; files</dt><dd>${h.files.count} · ${(h.files.bytes / 1024 ** 2).toFixed(1)} MB</dd>
    </dl>${healthProblems(h).map((p) => `<p class="txt-soon">${esc(p)}</p>`).join("")}` : `<p>Status isn't available right now.</p>`}
    <footer><div class="r"><button class="btn" data-act="close">Close</button></div></footer></div>`, null);
}

/* ---------- local storage (this browser only) ---------- */
const KEY = "homebox:v1", META = "homebox:meta";
const blank = () => ({ items: {}, tasks: {}, parts: {}, projects: {} });
function readStore() { try { const d = JSON.parse(localStorage.getItem(KEY)); return d && d.items && d.tasks ? { parts: {}, projects: {}, ...d } : null; } catch { return null; } }
function meta() { try { return JSON.parse(localStorage.getItem(META)) || {}; } catch { return {}; } }
function setMeta(patch) { try { localStorage.setItem(META, JSON.stringify({ ...meta(), ...patch })); } catch {} }
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const localDb = (() => {
  let store = readStore() || blank();
  const listeners = { items: [], tasks: [], parts: [], projects: [] };
  const emit = (col) => { const docs = Object.entries(store[col]).map(([id, d]) => ({ id, data: () => d })); listeners[col].forEach((fn) => fn({ docs })); };
  function commit(mutate) {
    const before = JSON.stringify(store);
    mutate();
    try { localStorage.setItem(KEY, JSON.stringify(store)); }
    catch (e) { store = JSON.parse(before); throw e; }
    emit("items"); emit("tasks"); emit("parts"); emit("projects");
    onCommit.forEach((fn) => fn());
  }
  const ref = (col, id) => ({
    id,
    async set(d) { commit(() => { store[col][id] = JSON.parse(JSON.stringify(d)); }); },
    async update(d) { commit(() => { store[col][id] = { ...store[col][id], ...JSON.parse(JSON.stringify(d)) }; }); },
    async delete() { commit(() => { delete store[col][id]; }); },
  });
  window.addEventListener("storage", (e) => { if (e.key === KEY) { store = readStore() || blank(); emit("items"); emit("tasks"); emit("parts"); emit("projects"); } });
  return {
    doc(path) { const [col, id] = path.split("/"); return ref(col, id); },
    collection(col) { return { doc: (id) => ref(col, id || newId()), onSnapshot(fn) { listeners[col].push(fn); setTimeout(() => emit(col)); return () => {}; } }; },
    raw: () => JSON.parse(JSON.stringify(store)),
    async replace(next) { commit(() => { store = { items: { ...next.items }, tasks: { ...next.tasks }, parts: { ...(next.parts || {}) }, projects: { ...(next.projects || {}) } }; }); },
    isNew: () => readStore() === null,
  };
})();

function seedExamples() {
  const d = (n, unit = "days") => addInterval(today(), n, unit);
  const items = {

    "ex-heater": { example: true, brand: "Rheem", product: "50 gal water heater", type: "Plumbing", location: "Utility closet", purchaseDate: d(-9, "years"), warrantyEnd: d(40), warrantyNotes: "6 yr tank warranty", registered: "yes", lifespan: "10", receipt: "Paper copy in the utility closet folder", log: [{ id: "ex-l1", date: d(-14, "months"), what: "Replaced anode rod", cost: "$45", by: "Me" }] },
    "ex-mower": { example: true, brand: "Honda", product: "HRN216 lawn mower", type: "Yard & garden", location: "Garage", model: "HRN216VKA", purchaseDate: d(-3, "years"), parts: "Blade 72511-VH7-000, spark plug NGK BPR5ES", lifespan: "10" },
  };
  const tasks = {
    "ex-filter": { example: true, title: "Replace furnace filter", itemId: "ex-furnace", every: 3, unit: "months", nextDue: d(-10), lastDone: d(-100), notes: "16x25x1 MERV 8", history: [d(-100)] },
    "ex-blower": { example: true, title: "Oil blower motor", itemId: "ex-furnace", every: 1, unit: "years", nextDue: d(14), lastDone: d(-351), notes: "2-3 drops SAE 20 non-detergent oil in each port.", history: [d(-351)] },
    "ex-flush": { example: true, title: "Flush water heater", itemId: "ex-heater", every: 1, unit: "years", nextDue: d(4, "months"), lastDone: d(-8, "months"), history: [d(-8, "months")] },
    "ex-winter": { example: true, title: "Winterize mower", itemId: "ex-mower", every: 1, unit: "years", nextDue: d(21), notes: "Add fuel stabilizer, run dry, change oil.", history: [] },
  };
  const parts = {
    "ex-pex": { example: true, name: "PEX elbow", category: "Plumbing", size: "1/2\" crimp, brass", qty: "6", unit: "pcs", stored: "Garage, bin 3", source: "Menards" },
    "ex-filter-stock": { example: true, name: "Furnace filter", category: "HVAC", size: "16x25x1 MERV 8", qty: "2", unit: "pcs", stored: "Basement shelf", itemId: "ex-furnace" },
  };
  const projects = {
    "ex-laundry": { example: true, name: "Laundry nook in the basement", status: "In progress", priority: "Medium", area: "Basement", start: d(-21), target: d(40), budget: "$1,200", who: "Me, electrician for the new circuit",
      description: "Move the washer and dryer next to the utility sink and add shelving.",
      steps: [{ id: "s1", text: "Run a new 20A circuit", done: true }, { id: "s2", text: "Install utility sink", done: false }, { id: "s3", text: "Build shelves", done: false }],
      materials: [{ id: "m1", text: "Utility sink and faucet", done: true }, { id: "m2", text: "20 ft of 1/2\" PEX", done: false }, { id: "m3", text: "Shelf brackets (8)", done: false }],
      log: [{ id: "pl1", date: d(-14), what: "Electrician ran the circuit", cost: "$350", by: "Spark Electric" }, { id: "pl2", date: d(-6), what: "Bought sink and faucet", cost: "$240", by: "Me" }] },
  };
  return localDb.replace({ items, tasks, parts, projects });
}

/* ---------- boot ---------- */
render();
(async () => {
  S.db = localDb;
  if (localDb.isNew()) { try { await seedExamples(); } catch {} }
  localDb.collection("items").onSnapshot((s) => { S.items = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.items = true; render(); refreshSheet(); });
  localDb.collection("tasks").onSnapshot((s) => { S.tasks = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.tasks = true; render(); refreshSheet(); });
  localDb.collection("parts").onSnapshot((s) => { S.parts = s.docs.map((d) => ({ id: d.id, ...d.data() })); render(); refreshSheet(); });
  localDb.collection("projects").onSnapshot((s) => { S.projects = s.docs.map((d) => ({ id: d.id, ...d.data() })); render(); refreshSheet(); });
  try { navigator.storage?.persist?.(); } catch {}
  try { if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {}); } catch {}
  await srvInit(); render();
  setTimeout(openFromHash);
  if (SRV.on) return;
  if (meta().fileMode === "auto") {
    if (!CAN_FS) { setMeta({ fileMode: "manual" }); return render(); }
    FILE.handle = await fsRecall();
    if (!FILE.handle) { FILE.status = "error"; return render(); }
    const perm = await FILE.handle.queryPermission({ mode: "readwrite" }).catch(() => "denied");
    if (perm === "granted") await fsSync(); else { FILE.status = "needs-permission"; render(); }
  }
})();
function refreshSheet() {
  if (!dlg.open) return;
  const item = sheet.querySelector("div[data-item]"), pj = sheet.querySelector("div[data-project]");
  if (item) itemSheet(item.dataset.item);
  else if (pj && !sheet.contains(document.activeElement)) projectSheet(pj.dataset.project);
}
function backToOwner() {
  const id = sheet.dataset.back;
  if (!id) return closeSheet();
  return sheet.dataset.backcol === "projects" ? projectSheet(id) : itemSheet(id);
}
