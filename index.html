<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homebox</title>
<meta name="description" content="Home equipment, tools and parts log with maintenance reminders.">
<meta name="theme-color" content="#2C6A4D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Homebox">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100% }
img { max-width: 100% }
/* Layout: a single column workbench — summary strip, then two tabs (maintenance due / equipment list); forms open as sheets. */
:root {
  --bg: #F3F3F4; --surface: #FFFFFF; --sunk: #E9E9EB; --ink: #1E1E21; --muted: #616166; --line: #D7D7DB;
  --accent: #2C6A4D; --accent-ink: #FFFFFF; --tag: #EADFC2; --tag-ink: #5A4A1E;
  --over: #B2321E; --soon: #9A6200; --ok: #2C6A4D;
  --display: "Bitter", "Rockwell", Georgia, serif;
  --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161618; --surface: #1F1F22; --sunk: #28282C; --ink: #E8E8EA; --muted: #A0A0A6; --line: #34343A;
  --accent: #72C49A; --accent-ink: #0D1310; --tag: #3A3322; --tag-ink: #E6D3A3;
  --over: #F27D69; --soon: #E5AA42; --ok: #72C49A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161618; --surface: #1F1F22; --sunk: #28282C; --ink: #E8E8EA; --muted: #A0A0A6; --line: #34343A;
  --accent: #72C49A; --accent-ink: #0D1310; --tag: #3A3322; --tag-ink: #E6D3A3;
  --over: #F27D69; --soon: #E5AA42; --ok: #72C49A; color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 880px; margin: 0 auto; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand h1 { font-size: 38px; font-weight: 800; letter-spacing: .04em; line-height: 1; text-transform: uppercase }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px }
.actions { display: flex; gap: 8px; flex-wrap: wrap }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; white-space: nowrap }
a.btn { color: var(--ink); text-decoration: none; display: inline-block }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.small { padding: 4px 10px; font-size: 13px }
.btn.danger { color: var(--over) }
.btn.danger.armed { background: var(--over); color: var(--surface); border-color: var(--over) }
.btn.link { border: 0; background: none; padding: 4px 6px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px }

.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface) }
.strip > div { padding: 12px 14px; border-left: 1px solid var(--line); min-width: 0 }
.strip > div:first-child { border-left: 0 }
.strip b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums }
.strip span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.strip .over b { color: var(--over) } .strip .soon b { color: var(--soon) }
@media (max-width: 560px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .strip > div:nth-child(3) { border-left: 0 } .strip > div:nth-child(n+3) { border-top: 1px solid var(--line) } }

nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 28px 0 0; border-bottom: 1px solid var(--line) }
nav.tabs button { white-space: nowrap; flex: none; border: 0; background: none; padding: 10px 14px; cursor: pointer; font-family: var(--body); font-weight: 700; font-size: 16px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 }
.toolbar input, .toolbar select { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); min-width: 0 }
.toolbar input { flex: 1 1 200px }

.group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--body); font-weight: 600; margin: 22px 0 8px }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden }
.row { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 0 14px; align-items: center; padding: 12px 14px 12px 0; border-top: 1px solid var(--line) }
.row:first-child { border-top: 0 }
.row .stripe { align-self: stretch; background: var(--line) }
.row.over .stripe { background: var(--over) } .row.soon .stripe { background: var(--soon) } .row.ok .stripe { background: var(--ok); opacity: .45 }
.row .main { min-width: 0 }
.row .title { font-weight: 600; overflow-wrap: anywhere }
.row .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 2px }
.row .side { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end }
.row.clickable { cursor: pointer } .row.clickable:hover { background: var(--sunk) }
@media (max-width: 560px) { .row { grid-template-columns: 6px minmax(0, 1fr) } .row .side { grid-column: 2; justify-content: flex-start; margin-top: 8px } }

.due { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums }
.over .due, .txt-over { color: var(--over) } .soon .due, .txt-soon { color: var(--soon) }
.log { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden }
.log .entry { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 10px 12px; border-top: 1px solid var(--line) }
.log .entry:first-child { border-top: 0 }
.log .entry .what { overflow-wrap: anywhere } .log .entry .sm { color: var(--muted); font-size: 13px }
@media (max-width: 480px) { .log .entry { grid-template-columns: minmax(0, 1fr) auto } .log .entry .due { grid-column: 1 / -1 } }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 3px; background: var(--tag); color: var(--tag-ink); font-weight: 500 }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; font-weight: 500; white-space: nowrap }
.pill.over { color: var(--over) } .pill.soon { color: var(--soon) } .pill.ok { color: var(--ok) } .pill.none { color: var(--muted) }
.ex { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px dashed var(--muted); border-radius: 3px; padding: 0 5px; margin-left: 6px; vertical-align: 2px }
.mono { font-family: var(--mono); font-size: 13px }

.empty { padding: 32px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); background: var(--surface) }
.empty strong { display: block; color: var(--ink); font-family: var(--display); font-size: 18px; margin-bottom: 4px }
.notice { padding: 10px 14px; border-radius: var(--radius); background: var(--sunk); color: var(--muted); font-size: 14px; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px) }
dialog::backdrop { background: rgb(0 0 0 / .45) }
.sheet { padding: 20px }
.sheet h2 { font-size: 21px; margin-bottom: 14px; overflow-wrap: anywhere }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.fields .full { grid-column: 1 / -1 }
@media (max-width: 480px) { .fields { grid-template-columns: minmax(0, 1fr) } }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; min-width: 0 }
label.f input, label.f select, label.f textarea { font-weight: 400; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); width: 100%; min-width: 0 }
label.f textarea { min-height: 70px; resize: vertical }
.hint { font-weight: 400; color: var(--muted); font-size: 12px }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px }
.inline { display: flex; gap: 8px } .inline > * { flex: 1; min-width: 0 }
.sheet footer { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-top: 18px }
.sheet footer .r { display: flex; gap: 8px; margin-left: auto }
.err { color: var(--over); font-size: 14px; margin-top: 10px }

dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0 0 16px }
dl.facts dt { color: var(--muted); font-size: 13px } dl.facts dd { margin: 0; overflow-wrap: anywhere }
dl.facts dd.pre { white-space: pre-line } dl.facts a { color: var(--accent) }
.sub { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 18px 0 8px; display: flex; justify-content: space-between; align-items: center }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 14px; z-index: 20 }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out } @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0 } } }
.datafoot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 13px }
.datafoot .actions { gap: 6px }
@media (max-width: 420px) { nav.tabs button { padding: 10px 7px; font-size: 15px } }
@media (max-width: 480px) { header.top .actions { width: 100% } header.top .actions .btn { flex: 1 1 auto; padding: 8px 10px; font-size: 14px } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Homebox</h1>
      <p>Equipment, tools and parts around the house, and the upkeep they need.</p>
    </div>
    <div class="actions">
      <button class="btn primary" data-act="new-task" id="btn-new-task">Add maintenance</button>
      <button class="btn primary" data-act="new-item" id="btn-new-item">Add equipment</button>
      <button class="btn primary" data-act="new-part" id="btn-new-part">Add parts &amp; supplies</button>
    </div>
  </header>

  <div class="strip" id="strip">
    <div><b id="s-items">–</b><span>Items</span></div>
    <div class="over"><b id="s-over">–</b><span>Overdue</span></div>
    <div class="soon"><b id="s-soon">–</b><span>Due in 30 days</span></div>
    <div><b id="s-warr">–</b><span>Warranties ending</span></div>
  </div>

  <div id="banner"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-upcoming" data-view="upcoming" aria-selected="true">Maintenance</button>
    <button role="tab" id="tab-items" data-view="items" aria-selected="false">Equipment</button>
    <button role="tab" id="tab-parts" data-view="parts" aria-selected="false">Parts &amp; supplies</button>
  </nav>

  <section id="view-upcoming"></section>
  <section id="view-items" hidden>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search brand, product, specs, parts…" aria-label="Search equipment">
      <select id="f-type" aria-label="Filter by type"><option value="">All types</option></select>
      <select id="f-loc" aria-label="Filter by location"><option value="">All locations</option></select>
    </div>
    <div id="items-list"></div>
  </section>
  <section id="view-parts" hidden>
    <div class="toolbar">
      <input id="pq" type="search" placeholder="Search name, size, part number, where it's kept…" aria-label="Search parts and supplies">
      <select id="f-pcat" aria-label="Filter by category"><option value="">All categories</option></select>
    </div>
    <div id="parts-list"></div>
  </section>

  <footer class="datafoot" id="datafoot"></footer>
  <input type="file" id="restore-file" accept=".json,application/json" hidden>
</div>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<datalist id="dl-types"></datalist>
<datalist id="dl-locs"></datalist>
<datalist id="dl-tasks"></datalist>
<datalist id="dl-pcats"></datalist>
<datalist id="dl-units"></datalist>

<script>
const DEFAULT_TYPES = ["Appliance", "HVAC", "Plumbing", "Electrical", "Power tool", "Hand tool", "Yard & garden", "Vehicle", "Electronics", "Part / supply"];
const DEFAULT_LOCS = ["Basement", "Garage", "Kitchen", "Laundry room", "Utility closet", "Attic", "Shed", "Yard"];
const PART_CATS = ["Plumbing", "Electrical", "HVAC", "Fasteners", "Appliance parts", "Lighting", "Paint & finish", "Lumber & building", "Yard & garden", "Other"];
const PART_UNITS = ["pcs", "ft", "box", "pack", "roll", "gal", "lb"];
const LIFESPAN_HINT = "Typical: water heater 8–12, furnace 15–20, central AC 10–15, washer or dryer 10–13, fridge 10–15, dishwasher 9–12, roof 20–30.";
const TASK_IDEAS = ["Replace furnace filter", "Oil blower motor", "Winterize", "Clean dryer vent", "Flush water heater", "Test smoke & CO detectors", "Service lawn mower", "Clean gutters", "Replace fridge water filter", "Sharpen blades"];
const UNITS = { days: "day", weeks: "week", months: "month", years: "year" };
const RRULE = { days: "DAILY", weeks: "WEEKLY", months: "MONTHLY", years: "YEARLY" };

const S = { items: [], tasks: [], parts: [], view: "upcoming", db: null, dl: null, loaded: { items: false, tasks: false } };
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- dates (all stored as YYYY-MM-DD, local) ---------- */
const pad = (n) => String(n).padStart(2, "0");
const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => fmt(new Date());
const daysUntil = (s) => Math.round((parse(s) - parse(today())) / 86400000);
function addInterval(s, n, unit) {
  const d = parse(s); n = Number(n) || 0;
  if (unit === "days") d.setDate(d.getDate() + n);
  else if (unit === "weeks") d.setDate(d.getDate() + 7 * n);
  else {
    const months = unit === "years" ? 12 * n : n, day = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + months);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  }
  return fmt(d);
}
const nice = (s) => s ? parse(s).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
const every = (t) => `Every ${Number(t.every) === 1 ? "" : t.every + " "}${UNITS[t.unit] || "month"}${Number(t.every) === 1 ? "" : "s"}`;
function rel(s) {
  const n = daysUntil(s);
  if (n === 0) return "due today";
  if (n < 0) return `${-n} day${n === -1 ? "" : "s"} overdue`;
  if (n === 1) return "due tomorrow";
  if (n < 45) return `in ${n} days`;
  return nice(s);
}
const dueClass = (s) => { const n = daysUntil(s); return n < 0 ? "over" : n <= 30 ? "soon" : "ok"; };

function warranty(it) {
  if (!it.warrantyEnd) return { cls: "none", text: "No warranty info" };
  const n = daysUntil(it.warrantyEnd);
  if (n < 0) return { cls: "none", text: "Warranty expired" };
  if (n <= 90) return { cls: "soon", text: `Warranty ends in ${n} day${n === 1 ? "" : "s"}` };
  return { cls: "ok", text: `Warranty to ${parse(it.warrantyEnd).toLocaleDateString(undefined, { month: "short", year: "numeric" })}` };
}
function lifespan(it) {
  const start = it.installDate || it.purchaseDate, yrs = Number(it.lifespan);
  if (!start || !yrs) return null;
  const age = (parse(today()) - parse(start)) / (365.25 * 86400000), left = yrs - age, whole = Math.floor(age);
  const ageText = age < 1 ? "Under 1 yr old" : `${whole} yr${whole === 1 ? "" : "s"} old`;
  if (left <= 0) return { cls: "over", text: "Past expected life", ageText, yrs };
  const l = Math.max(1, Math.round(left));
  if (age >= yrs * 0.8 || left <= 2) return { cls: "soon", text: `Near end of life (~${l} yr${l === 1 ? "" : "s"} left)`, ageText, yrs };
  return { cls: "ok", text: `~${l} yrs of life left`, ageText, yrs };
}
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";
const linkText = (u) => u.replace(/^https?:\/\/(www\.)?/i, "").slice(0, 60);
const itemName = (it) => [it.brand, it.product].filter(Boolean).join(" ") || "Untitled item";
const itemById = (id) => S.items.find((i) => i.id === id);

/* ---------- rendering ---------- */
function render() {
  const ready = S.loaded.items && S.loaded.tasks;
  const over = S.tasks.filter((t) => t.nextDue && daysUntil(t.nextDue) < 0).length;
  const soon = S.tasks.filter((t) => t.nextDue && daysUntil(t.nextDue) >= 0 && daysUntil(t.nextDue) <= 30).length;
  const warr = S.items.filter((i) => warranty(i).cls === "soon").length;
  $("s-items").textContent = ready ? S.items.length : "–";
  $("s-over").textContent = ready ? over : "–";
  $("s-soon").textContent = ready ? soon : "–";
  $("s-warr").textContent = ready ? warr : "–";

  const examples = S.items.some((i) => i.example) || S.tasks.some((t) => t.example) || S.parts.some((x) => x.example);
  const real = S.items.filter((i) => !i.example).length + S.tasks.filter((t) => !t.example).length;
  const m = meta(), last = m.lastBackup, mode = m.fileMode || "";
  const stale = !mode && real >= 3 && (!last || daysUntil(last) < -30);
  const unsaved = mode === "manual" && localSig() !== m.savedSig;
  let fileNotice = "";
  if (mode === "auto" && FILE.status === "needs-permission") fileNotice = `<div class="notice"><span>Homebox saves to <b>${esc(m.fileName || "your data file")}</b>. Click Reconnect so it can keep saving there.</span><button class="btn small primary" data-act="fs-reconnect" id="btn-fs-reconnect">Reconnect</button></div>`;
  if (mode === "auto" && FILE.status === "error") fileNotice = `<div class="notice"><span>Couldn't save to <b>${esc(m.fileName || "your data file")}</b>. It may have been moved, renamed or deleted. Your changes are still safe in this browser.</span><button class="btn small primary" data-act="fs-create" id="btn-fs-again">Choose where to save</button></div>`;
  if (unsaved) fileNotice = `<div class="notice"><span>You have changes that aren't in your data file yet.</span><button class="btn small primary" data-act="file-save" id="btn-file-save-nudge">Save to file</button></div>`;
  $("banner").innerHTML = (examples ? `<div class="notice"><span>The entries marked <span class="ex">Example</span> are samples to show how Homebox works.</span><button class="btn small" data-act="clear-examples" id="btn-clear-ex">Remove examples</button></div>` : "")
    + fileNotice
    + (stale ? `<div class="notice"><span>${last ? `Your last backup was ${esc(nice(last))}.` : "You haven't backed up yet."} Homebox lives only in this browser, so keep a copy somewhere safe.</span><button class="btn small primary" data-act="backup" id="btn-backup-nudge">Download backup</button></div>` : "");
  renderDataFoot(m, unsaved);

  fillLists();
  renderUpcoming(ready);
  renderItems(ready);
  renderParts(ready);
}

function fillLists() {
  const types = [...new Set([...S.items.map((i) => i.type).filter(Boolean), ...DEFAULT_TYPES])];
  const locs = [...new Set([...S.items.map((i) => i.location).filter(Boolean), ...DEFAULT_LOCS])];
  $("dl-types").innerHTML = types.map((t) => `<option value="${esc(t)}">`).join("");
  $("dl-locs").innerHTML = locs.map((t) => `<option value="${esc(t)}">`).join("");
  $("dl-tasks").innerHTML = TASK_IDEAS.map((t) => `<option value="${esc(t)}">`).join("");
  const pcats = [...new Set([...S.parts.map((x) => x.category).filter(Boolean), ...PART_CATS])];
  $("dl-pcats").innerHTML = pcats.map((t) => `<option value="${esc(t)}">`).join("");
  $("dl-units").innerHTML = PART_UNITS.map((t) => `<option value="${esc(t)}">`).join("");
  const usedCats = [...new Set(S.parts.map((x) => x.category).filter(Boolean))].sort();
  { const sel = $("f-pcat"), cur = sel.value; sel.innerHTML = `<option value="">All categories</option>` + usedCats.map((v) => `<option${v === cur ? " selected" : ""}>${esc(v)}</option>`).join(""); }
  const usedTypes = [...new Set(S.items.map((i) => i.type).filter(Boolean))].sort();

function renderUpcoming(ready) {

  if (!ready) { el.innerHTML = S.db === false ? "" : `<div class="empty" style="margin-top:16px">Loading your maintenance schedule…</div>`; return; }
  if (!S.tasks.length) {
    el.innerHTML = `<div class="empty" style="margin-top:16px"><strong>No maintenance scheduled yet</strong>Add a recurring task, like a filter change every 3 months or winterizing every October.<br><br><button class="btn primary" data-act="new-task" id="btn-empty-task">Add maintenance</button></div>`;
    return;
  }
  const sorted = [...S.tasks].sort((a, b) => (a.nextDue || "").localeCompare(b.nextDue || ""));
  const groups = [
    ["Overdue", sorted.filter((t) => daysUntil(t.nextDue) < 0)],

  el.innerHTML = groups.filter(([, l]) => l.length).map(([h, l]) =>

/* ---------- calendar link (Google Calendar, repeating all-day event) ---------- */
function calLink(t) {
  const it = itemById(t.itemId);
  const start = t.nextDue.replace(/-/g, ""), end = addInterval(t.nextDue, 1, "days").replace(/-/g, "");
  const details = [it ? `For: ${itemName(it)}${it.location ? " (" + it.location + ")" : ""}` : "", t.notes || "", "From Homebox"].filter(Boolean).join("\n");
  const p = new URLSearchParams({ action: "TEMPLATE", text: t.title, dates: `${start}/${end}`, details,
    recur: `RRULE:FREQ=${RRULE[t.unit] || "MONTHLY"};INTERVAL=${Math.max(1, Number(t.every) || 1)}` });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

/* ---------- writes ---------- */
function toast(msg) { document.querySelectorAll(".toast").forEach((x) => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
async function write(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const msg = "Couldn't save. Your browser's storage may be full, or blocked in private browsing.";
    const err = $("form-err"); if (err && dlg.open) { err.textContent = msg; err.hidden = false; } else toast(msg);
    return false;
  }
}
const formData = (f) => Object.fromEntries([...new FormData(f).entries()].map(([k, v]) => [k, String(v).trim()]));

document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, id = f.dataset.id;
  if (!S.db) return;
  if (f.id === "item-form") {
    const d = formData(f);
    const ref = id ? S.db.doc("items/" + id) : S.db.collection("items").doc();
    const prev = id ? itemById(id) : null;

  }
  if (f.id === "log-form") {
    const d = formData(f), itemId = f.dataset.item, it = itemById(itemId); if (!it) return closeSheet();
    const lid = f.dataset.log || newId();
    const log = (it.log || []).filter((x) => x.id !== lid).concat({ id: lid, date: d.date, what: d.what, cost: d.cost, by: d.by });
    if (await write(() => S.db.doc("items/" + itemId).update({ log }), f.dataset.log ? "Entry updated" : "Entry added")) itemSheet(itemId);
  }
  if (f.id === "part-form") {

let armed = null;

  btn.dataset.label = btn.textContent; btn.textContent = label; btn.classList.add("armed"); armed = btn;
  return false;
}

/* ---------- data file ---------- */
// Chrome and Edge can keep writing to a file the person picks ("auto").
// Firefox and Safari can't, so there the file is opened and saved by hand ("manual").
const onCommit = [];
const CAN_FS = typeof window.showSaveFilePicker === "function" && typeof window.showOpenFilePicker === "function";
const FILE = { handle: null, status: "off", savedAt: null, timer: null, queue: Promise.resolve() };
const FILE_TYPES = [{ description: "Homebox data", accept: { "application/json": [".json"] } }];
const stable = (v) => Array.isArray(v) ? `[${v.map(stable).join(",")}]` : v && typeof v === "object" ? `{${Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + stable(v[k])).join(",")}}` : JSON.stringify(v ?? null);
function sigOf(d) { const s = stable({ items: d.items || {}, tasks: d.tasks || {}, parts: d.parts || {} }); let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0; return h.toString(36) + "." + s.length; }
const localSig = () => sigOf(localDb.raw());
const snapshot = () => { const r = localDb.raw(); return JSON.stringify({ app: "homebox", version: 1, exportedAt: new Date().toISOString(), items: r.items, tasks: r.tasks, parts: r.parts }, null, 2); };
function parseHomebox(text) {
  try { const d = JSON.parse(text); return d && d.app === "homebox" && d.items && typeof d.items === "object" && d.tasks && typeof d.tasks === "object" ? d : null; } catch { return null; }
}

function manualSave(msg, starting) {

// Remember the chosen file between visits (Chrome/Edge store file handles in IndexedDB).
function kv(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open("homebox", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onerror = () => rej(r.error);
    r.onsuccess = () => { const t = r.result.transaction("kv", mode); const q = fn(t.objectStore("kv")); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); };
  });
}
const fsRemember = (h) => kv("readwrite", (s) => s.put(h, "handle")).catch(() => {});
const fsForget = () => kv("readwrite", (s) => s.delete("handle")).catch(() => {});
const fsRecall = () => kv("readonly", (s) => s.get("handle")).catch(() => null);

function fsFail(e) {
  if (e?.name === "AbortError") return;
  toast(e?.name === "NotAllowedError" ? "Homebox needs permission to save to that file." : "Couldn't use that file. Try again or pick another.");
}
async function fsWriteNow() {
  if (!FILE.handle) return;
  try {
    const w = await FILE.handle.createWritable();
    await w.write(snapshot()); await w.close();
    FILE.status = "connected"; FILE.savedAt = new Date();
    setMeta({ savedSig: localSig(), lastBackup: today() });
  } catch (e) { FILE.status = e?.name === "NotAllowedError" ? "needs-permission" : "error"; }
  render();
}
function fsScheduleWrite() {
  if (meta().fileMode !== "auto" || FILE.status !== "connected") return;
  clearTimeout(FILE.timer);
  FILE.timer = setTimeout(() => { FILE.timer = null; FILE.queue = FILE.queue.then(fsWriteNow); }, 400);
}
onCommit.push(fsScheduleWrite);

async function fsUse(handle) {
  FILE.handle = handle; FILE.status = "connected";
  setMeta({ fileMode: "auto", fileName: handle.name });
  await fsRemember(handle);
}
async function fsCreate() {
  const h = await window.showSaveFilePicker({ suggestedName: "homebox.json", types: FILE_TYPES });
  await fsUse(h); await fsWriteNow();
  closeSheet(); toast(`Saving to ${h.name}`);
}
async function fsOpen() {
  const [h] = await window.showOpenFilePicker({ types: FILE_TYPES });
  if ((await h.requestPermission({ mode: "readwrite" })) !== "granted") throw Object.assign(new Error(), { name: "NotAllowedError" });
  const data = parseHomebox(await (await h.getFile()).text());
  if (!data) { toast("That file isn't a Homebox data file."); return; }
  await localDb.replace(data);
  await fsUse(h); setMeta({ savedSig: localSig() }); FILE.savedAt = new Date();
  closeSheet(); render(); toast(`Opened ${h.name}`);
}
async function fsReconnect() {
  if (!FILE.handle) return fileSetupSheet();
  if ((await FILE.handle.requestPermission({ mode: "readwrite" })) !== "granted") return;
  await fsSync();
}
let fsPendingFile = null;
// Reconcile the file with this browser. savedSig is the last state both agreed on.
async function fsSync() {
  if (!FILE.handle || FILE.timer) return;
  let data;
  try { data = parseHomebox(await (await FILE.handle.getFile()).text()); }
  catch (e) { FILE.status = e?.name === "NotAllowedError" ? "needs-permission" : "error"; return render(); }
  if (!data) { FILE.status = "error"; return render(); }
  FILE.status = "connected";
  const fs = sigOf(data), ls = localSig(), base = meta().savedSig;
  if (fs === ls) { setMeta({ savedSig: ls }); }
  else if (ls === base) { await localDb.replace(data); setMeta({ savedSig: localSig() }); toast("Loaded the latest changes from your file"); }
  else if (fs === base) { await fsWriteNow(); }
  else {
    fsPendingFile = data; sheet.dataset.back = "";
    openSheet(`<div><h2>Two different versions</h2>
      <p><b>${esc(FILE.handle.name)}</b> was changed somewhere else, maybe on another computer, and Homebox in this browser has changes too.</p>
      <p>Choose which version to keep. The other one is replaced.</p>
      <footer><div class="r"><button class="btn" data-act="fs-use-local" id="btn-fs-local">Keep this browser's version</button><button class="btn primary" data-act="fs-use-file" id="btn-fs-file">Use the file's version</button></div></footer></div>`);
  }
  render();
}
async function fsResolve(which) {
  if (which === "file" && fsPendingFile) { await localDb.replace(fsPendingFile); setMeta({ savedSig: localSig() }); }
  else await fsWriteNow();
  fsPendingFile = null; render();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && meta().fileMode === "auto" && FILE.status === "connected") fsSync(); });
window.addEventListener("beforeunload", (e) => {
  const m = meta();
  if ((m.fileMode === "manual" && localSig() !== m.savedSig) || FILE.timer) { e.preventDefault(); e.returnValue = ""; }
});

/* ---------- local storage (this browser only) ---------- */
const KEY = "homebox:v1", META = "homebox:meta";
const blank = () => ({ items: {}, tasks: {}, parts: {} });
function readStore() { try { const d = JSON.parse(localStorage.getItem(KEY)); return d && d.items && d.tasks ? { parts: {}, ...d } : null; } catch { return null; } }
function meta() { try { return JSON.parse(localStorage.getItem(META)) || {}; } catch { return {}; } }
function setMeta(patch) { try { localStorage.setItem(META, JSON.stringify({ ...meta(), ...patch })); } catch {} }
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const localDb = (() => {
  let store = readStore() || blank();
  const listeners = { items: [], tasks: [], parts: [] };
  const emit = (col) => { const docs = Object.entries(store[col]).map(([id, d]) => ({ id, data: () => d })); listeners[col].forEach((fn) => fn({ docs })); };
  function commit(mutate) {
    const before = JSON.stringify(store);
    mutate();
    try { localStorage.setItem(KEY, JSON.stringify(store)); }
    catch (e) { store = JSON.parse(before); throw e; }
    emit("items"); emit("tasks"); emit("parts");
    onCommit.forEach((fn) => fn());
  }
  const ref = (col, id) => ({
    id,
    async set(d) { commit(() => { store[col][id] = JSON.parse(JSON.stringify(d)); }); },
    async update(d) { commit(() => { store[col][id] = { ...store[col][id], ...JSON.parse(JSON.stringify(d)) }; }); },
    async delete() { commit(() => { delete store[col][id]; }); },
  });
  window.addEventListener("storage", (e) => { if (e.key === KEY) { store = readStore() || blank(); emit("items"); emit("tasks"); emit("parts"); } });
  return {
    doc(path) { const [col, id] = path.split("/"); return ref(col, id); },
    collection(col) { return { doc: (id) => ref(col, id || newId()), onSnapshot(fn) { listeners[col].push(fn); setTimeout(() => emit(col)); return () => {}; } }; },
    raw: () => JSON.parse(JSON.stringify(store)),
    async replace(next) { commit(() => { store = { items: { ...next.items }, tasks: { ...next.tasks }, parts: { ...(next.parts || {}) } }; }); },
    isNew: () => readStore() === null,
  };
})();

function seedExamples() {
  const d = (n, unit = "days") => addInterval(today(), n, unit);
  const items = {
    "ex-furnace": { example: true, brand: "Carrier", product: "Performance 96 gas furnace", type: "HVAC", location: "Basement", model: "59SC5A060E17", purchaseDate: d(-5, "years"), price: "$3,400 installed", store: "ABC Heating & Cooling", warrantyEnd: d(5, "years"), warrantyNotes: "Parts 10 yr (registered). Labor 1 yr.", specs: "60,000 BTU, 96% AFUE\n120V / 15A circuit\n17.5\" W x 33\" H x 29.5\" D", parts: "Filter 16x25x1 MERV 8", service: "ABC Heating, 555-0142", notes: "Filter slot is on the left side of the blower cabinet." },
    "ex-heater": { example: true, brand: "Rheem", product: "50 gal water heater", type: "Plumbing", location: "Utility closet", purchaseDate: d(-9, "years"), warrantyEnd: d(40), warrantyNotes: "6 yr tank warranty", registered: "yes", lifespan: "10", receipt: "Paper copy in the utility closet folder", log: [{ id: "ex-l1", date: d(-14, "months"), what: "Replaced anode rod", cost: "$45", by: "Me" }] },
    "ex-mower": { example: true, brand: "Honda", product: "HRN216 lawn mower", type: "Yard & garden", location: "Garage", model: "HRN216VKA", purchaseDate: d(-3, "years"), parts: "Blade 72511-VH7-000, spark plug NGK BPR5ES", lifespan: "10" },
  };
  const tasks = {
    "ex-filter": { example: true, title: "Replace furnace filter", itemId: "ex-furnace", every: 3, unit: "months", nextDue: d(-10), lastDone: d(-100), notes: "16x25x1 MERV 8", history: [d(-100)] },

    "ex-flush": { example: true, title: "Flush water heater", itemId: "ex-heater", every: 1, unit: "years", nextDue: d(4, "months"), lastDone: d(-8, "months"), history: [d(-8, "months")] },
    "ex-winter": { example: true, title: "Winterize mower", itemId: "ex-mower", every: 1, unit: "years", nextDue: d(21), notes: "Add fuel stabilizer, run dry, change oil.", history: [] },
  };
  const parts = {
    "ex-pex": { example: true, name: "PEX elbow", category: "Plumbing", size: "1/2\" crimp, brass", qty: "6", unit: "pcs", stored: "Garage, bin 3", source: "Menards" },
    "ex-filter-stock": { example: true, name: "Furnace filter", category: "HVAC", size: "16x25x1 MERV 8", qty: "2", unit: "pcs", stored: "Basement shelf", itemId: "ex-furnace" },
  };
  return localDb.replace({ items, tasks, parts });
}

/* ---------- boot ---------- */
render();
(async () => {
  S.db = localDb;
  if (localDb.isNew()) { try { await seedExamples(); } catch {} }
  localDb.collection("items").onSnapshot((s) => { S.items = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.items = true; render(); refreshSheet(); });
  localDb.collection("tasks").onSnapshot((s) => { S.tasks = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.tasks = true; render(); refreshSheet(); });
  localDb.collection("parts").onSnapshot((s) => { S.parts = s.docs.map((d) => ({ id: d.id, ...d.data() })); render(); refreshSheet(); });
  try { navigator.storage?.persist?.(); } catch {}
  try { if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {}); } catch {}
  if (meta().fileMode === "auto") {
    if (!CAN_FS) { setMeta({ fileMode: "manual" }); return render(); }
    FILE.handle = await fsRecall();
    if (!FILE.handle) { FILE.status = "error"; return render(); }
    const perm = await FILE.handle.queryPermission({ mode: "readwrite" }).catch(() => "denied");
    if (perm === "granted") await fsSync(); else { FILE.status = "needs-permission"; render(); }
  }
})();
function refreshSheet() {
  const open = dlg.open && sheet.querySelector("div[data-item]");
  if (open) itemSheet(open.dataset.item);
}
