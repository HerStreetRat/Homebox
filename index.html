<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homebox</title>
<meta name="description" content="Home equipment, tools and parts log with maintenance reminders.">
<meta name="theme-color" content="#2C6A4D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Homebox">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100% }
img { max-width: 100% }
/* Layout: a single column workbench — summary strip, then two tabs (maintenance due / equipment list); forms open as sheets. */
:root {
  --bg: #F2F3EF; --surface: #FFFFFF; --sunk: #E8EAE4; --ink: #1C2421; --muted: #5C6862; --line: #D5DAD4;
  --accent: #2C6A4D; --accent-ink: #FFFFFF; --tag: #EADFC2; --tag-ink: #5A4A1E;
  --over: #B2321E; --soon: #9A6200; --ok: #2C6A4D;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121715; --surface: #1A211E; --sunk: #222A26; --ink: #E4EAE6; --muted: #98A49E; --line: #2D3732;
  --accent: #72C49A; --accent-ink: #0D1310; --tag: #3A3322; --tag-ink: #E6D3A3;
  --over: #F27D69; --soon: #E5AA42; --ok: #72C49A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121715; --surface: #1A211E; --sunk: #222A26; --ink: #E4EAE6; --muted: #98A49E; --line: #2D3732;
  --accent: #72C49A; --accent-ink: #0D1310; --tag: #3A3322; --tag-ink: #E6D3A3;
  --over: #F27D69; --soon: #E5AA42; --ok: #72C49A; color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 880px; margin: 0 auto; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand h1 { font-size: 40px; font-weight: 800; font-stretch: 70%; letter-spacing: .01em; line-height: 1; text-transform: uppercase }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px }
.actions { display: flex; gap: 8px; flex-wrap: wrap }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; white-space: nowrap }
a.btn { color: var(--ink); text-decoration: none; display: inline-block }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.small { padding: 4px 10px; font-size: 13px }
.btn.danger { color: var(--over) }
.btn.danger.armed { background: var(--over); color: var(--surface); border-color: var(--over) }
.btn.link { border: 0; background: none; padding: 4px 6px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px }

.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface) }
.strip > div { padding: 12px 14px; border-left: 1px solid var(--line); min-width: 0 }
.strip > div:first-child { border-left: 0 }
.strip b { display: block; font-family: var(--display); font-stretch: 80%; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums }
.strip span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.strip .over b { color: var(--over) } .strip .soon b { color: var(--soon) }
@media (max-width: 560px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .strip > div:nth-child(3) { border-left: 0 } .strip > div:nth-child(n+3) { border-top: 1px solid var(--line) } }

nav.tabs { display: flex; gap: 4px; margin: 28px 0 0; border-bottom: 1px solid var(--line) }
nav.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-family: var(--display); font-weight: 700; font-stretch: 85%; font-size: 16px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 }
.toolbar input, .toolbar select { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); min-width: 0 }
.toolbar input { flex: 1 1 200px }

.group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--body); font-weight: 600; margin: 22px 0 8px }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden }
.row { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 0 14px; align-items: center; padding: 12px 14px 12px 0; border-top: 1px solid var(--line) }
.row:first-child { border-top: 0 }
.row .stripe { align-self: stretch; background: var(--line) }
.row.over .stripe { background: var(--over) } .row.soon .stripe { background: var(--soon) } .row.ok .stripe { background: var(--ok); opacity: .45 }
.row .main { min-width: 0 }
.row .title { font-weight: 600; overflow-wrap: anywhere }
.row .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 2px }
.row .side { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end }
.row.clickable { cursor: pointer } .row.clickable:hover { background: var(--sunk) }
@media (max-width: 560px) { .row { grid-template-columns: 6px minmax(0, 1fr) } .row .side { grid-column: 2; justify-content: flex-start; margin-top: 8px } }

.due { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums }
.over .due, .txt-over { color: var(--over) } .soon .due, .txt-soon { color: var(--soon) }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 3px; background: var(--tag); color: var(--tag-ink); font-weight: 500 }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; font-weight: 500; white-space: nowrap }
.pill.over { color: var(--over) } .pill.soon { color: var(--soon) } .pill.ok { color: var(--ok) } .pill.none { color: var(--muted) }
.ex { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px dashed var(--muted); border-radius: 3px; padding: 0 5px; margin-left: 6px; vertical-align: 2px }
.mono { font-family: var(--mono); font-size: 13px }

.empty { padding: 32px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); background: var(--surface) }
.empty strong { display: block; color: var(--ink); font-family: var(--display); font-size: 18px; margin-bottom: 4px }
.notice { padding: 10px 14px; border-radius: var(--radius); background: var(--sunk); color: var(--muted); font-size: 14px; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px) }
dialog::backdrop { background: rgb(0 0 0 / .45) }
.sheet { padding: 20px }
.sheet h2 { font-size: 22px; font-stretch: 85%; margin-bottom: 14px; overflow-wrap: anywhere }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.fields .full { grid-column: 1 / -1 }
@media (max-width: 480px) { .fields { grid-template-columns: minmax(0, 1fr) } }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; min-width: 0 }
label.f input, label.f select, label.f textarea { font-weight: 400; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); width: 100%; min-width: 0 }
label.f textarea { min-height: 70px; resize: vertical }
.hint { font-weight: 400; color: var(--muted); font-size: 12px }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px }
.inline { display: flex; gap: 8px } .inline > * { flex: 1; min-width: 0 }
.sheet footer { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-top: 18px }
.sheet footer .r { display: flex; gap: 8px; margin-left: auto }
.err { color: var(--over); font-size: 14px; margin-top: 10px }

dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0 0 16px }
dl.facts dt { color: var(--muted); font-size: 13px } dl.facts dd { margin: 0; overflow-wrap: anywhere }
dl.facts dd.pre { white-space: pre-line } dl.facts a { color: var(--accent) }
.sub { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 18px 0 8px; display: flex; justify-content: space-between; align-items: center }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 14px; z-index: 20 }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out } @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0 } } }
.datafoot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 13px }
.datafoot .actions { gap: 6px }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Homebox</h1>
      <p>Equipment, tools and parts around the house, and the upkeep they need.</p>
    </div>
    <div class="actions">
      <button class="btn" data-act="new-task" id="btn-new-task">Add maintenance</button>
      <button class="btn primary" data-act="new-item" id="btn-new-item">Add item</button>
    </div>
  </header>

  <div class="strip" id="strip">
    <div><b id="s-items">–</b><span>Items</span></div>
    <div class="over"><b id="s-over">–</b><span>Overdue</span></div>
    <div class="soon"><b id="s-soon">–</b><span>Due in 30 days</span></div>
    <div><b id="s-warr">–</b><span>Warranties ending</span></div>
  </div>

  <div id="banner"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-upcoming" data-view="upcoming" aria-selected="true">Maintenance</button>
    <button role="tab" id="tab-items" data-view="items" aria-selected="false">Equipment</button>
  </nav>

  <section id="view-upcoming"></section>
  <section id="view-items" hidden>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search brand, product, specs, parts…" aria-label="Search equipment">
      <select id="f-type" aria-label="Filter by type"><option value="">All types</option></select>
      <select id="f-loc" aria-label="Filter by location"><option value="">All locations</option></select>
    </div>
    <div id="items-list"></div>
  </section>

  <footer class="datafoot">
    <span id="data-note">Saved in this browser only. Download a backup now and then.</span>
    <span class="actions">
      <button class="btn small" data-act="backup" id="btn-backup">Download backup</button>
      <button class="btn small" data-act="restore" id="btn-restore">Restore from backup</button>
      <button class="btn small" data-act="export" id="btn-export">Export spreadsheet (CSV)</button>
    </span>
  </footer>
  <input type="file" id="restore-file" accept=".json,application/json" hidden>
</div>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<datalist id="dl-types"></datalist>
<datalist id="dl-locs"></datalist>
<datalist id="dl-tasks"></datalist>

<script>
const DEFAULT_TYPES = ["Appliance", "HVAC", "Plumbing", "Electrical", "Power tool", "Hand tool", "Yard & garden", "Vehicle", "Electronics", "Part / supply"];
const DEFAULT_LOCS = ["Basement", "Garage", "Kitchen", "Laundry room", "Utility closet", "Attic", "Shed", "Yard"];
const TASK_IDEAS = ["Replace furnace filter", "Oil blower motor", "Winterize", "Clean dryer vent", "Flush water heater", "Test smoke & CO detectors", "Service lawn mower", "Clean gutters", "Replace fridge water filter", "Sharpen blades"];
const UNITS = { days: "day", weeks: "week", months: "month", years: "year" };
const RRULE = { days: "DAILY", weeks: "WEEKLY", months: "MONTHLY", years: "YEARLY" };

const S = { items: [], tasks: [], view: "upcoming", db: null, dl: null, loaded: { items: false, tasks: false } };
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- dates (all stored as YYYY-MM-DD, local) ---------- */
const pad = (n) => String(n).padStart(2, "0");
const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => fmt(new Date());
const daysUntil = (s) => Math.round((parse(s) - parse(today())) / 86400000);
function addInterval(s, n, unit) {
  const d = parse(s); n = Number(n) || 0;
  if (unit === "days") d.setDate(d.getDate() + n);
  else if (unit === "weeks") d.setDate(d.getDate() + 7 * n);
  else {
    const months = unit === "years" ? 12 * n : n, day = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + months);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  }
  return fmt(d);
}
const nice = (s) => s ? parse(s).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
const every = (t) => `Every ${Number(t.every) === 1 ? "" : t.every + " "}${UNITS[t.unit] || "month"}${Number(t.every) === 1 ? "" : "s"}`;
function rel(s) {
  const n = daysUntil(s);
  if (n === 0) return "due today";
  if (n < 0) return `${-n} day${n === -1 ? "" : "s"} overdue`;
  if (n === 1) return "due tomorrow";
  if (n < 45) return `in ${n} days`;
  return nice(s);
}
const dueClass = (s) => { const n = daysUntil(s); return n < 0 ? "over" : n <= 30 ? "soon" : "ok"; };

function warranty(it) {
  if (!it.warrantyEnd) return { cls: "none", text: "No warranty info" };
  const n = daysUntil(it.warrantyEnd);
  if (n < 0) return { cls: "none", text: "Warranty expired" };
  if (n <= 90) return { cls: "soon", text: `Warranty ends in ${n} day${n === 1 ? "" : "s"}` };
  return { cls: "ok", text: `Warranty to ${parse(it.warrantyEnd).toLocaleDateString(undefined, { month: "short", year: "numeric" })}` };
}
const itemName = (it) => [it.brand, it.product].filter(Boolean).join(" ") || "Untitled item";
const itemById = (id) => S.items.find((i) => i.id === id);

/* ---------- rendering ---------- */
function render() {
  const ready = S.loaded.items && S.loaded.tasks;
  const over = S.tasks.filter((t) => t.nextDue && daysUntil(t.nextDue) < 0).length;
  const soon = S.tasks.filter((t) => t.nextDue && daysUntil(t.nextDue) >= 0 && daysUntil(t.nextDue) <= 30).length;
  const warr = S.items.filter((i) => warranty(i).cls === "soon").length;
  $("s-items").textContent = ready ? S.items.length : "–";
  $("s-over").textContent = ready ? over : "–";
  $("s-soon").textContent = ready ? soon : "–";
  $("s-warr").textContent = ready ? warr : "–";

  const examples = S.items.some((i) => i.example) || S.tasks.some((t) => t.example);
  const real = S.items.filter((i) => !i.example).length + S.tasks.filter((t) => !t.example).length;
  const last = meta().lastBackup;
  const stale = real >= 3 && (!last || daysUntil(last) < -30);
  $("banner").innerHTML = (examples ? `<div class="notice"><span>The entries marked <span class="ex">Example</span> are samples to show how Homebox works.</span><button class="btn small" data-act="clear-examples" id="btn-clear-ex">Remove examples</button></div>` : "")
    + (stale ? `<div class="notice"><span>${last ? `Your last backup was ${esc(nice(last))}.` : "You haven't backed up yet."} Homebox lives only in this browser, so keep a copy somewhere safe.</span><button class="btn small primary" data-act="backup" id="btn-backup-nudge">Download backup</button></div>` : "");
  $("data-note").textContent = last ? `Saved in this browser only. Last backup ${nice(last)}.` : "Saved in this browser only. Download a backup now and then.";

  fillLists();
  renderUpcoming(ready);
  renderItems(ready);
}

function fillLists() {
  const types = [...new Set([...S.items.map((i) => i.type).filter(Boolean), ...DEFAULT_TYPES])];
  const locs = [...new Set([...S.items.map((i) => i.location).filter(Boolean), ...DEFAULT_LOCS])];
  $("dl-types").innerHTML = types.map((t) => `<option value="${esc(t)}">`).join("");
  $("dl-locs").innerHTML = locs.map((t) => `<option value="${esc(t)}">`).join("");
  $("dl-tasks").innerHTML = TASK_IDEAS.map((t) => `<option value="${esc(t)}">`).join("");
  const usedTypes = [...new Set(S.items.map((i) => i.type).filter(Boolean))].sort();
  const usedLocs = [...new Set(S.items.map((i) => i.location).filter(Boolean))].sort();
  for (const [sel, vals, all] of [[$("f-type"), usedTypes, "All types"], [$("f-loc"), usedLocs, "All locations"]]) {
    const cur = sel.value;
    sel.innerHTML = `<option value="">${all}</option>` + vals.map((v) => `<option${v === cur ? " selected" : ""}>${esc(v)}</option>`).join("");
  }
}

function taskRow(t, showItem = true) {
  const it = itemById(t.itemId);
  const cls = dueClass(t.nextDue);
  return `<div class="row ${cls}">
    <span class="stripe"></span>
    <div class="main">
      <div class="title">${esc(t.title)}${t.example ? '<span class="ex">Example</span>' : ""}</div>
      <div class="meta">
        <span class="due">${esc(rel(t.nextDue))}${daysUntil(t.nextDue) < 45 ? " · " + esc(nice(t.nextDue)) : ""}</span>
        <span>${esc(every(t))}</span>
        ${showItem && it ? `<span>${esc(itemName(it))}${it.location ? " · " + esc(it.location) : ""}</span>` : ""}
        ${t.lastDone ? `<span>Last done ${esc(nice(t.lastDone))}</span>` : ""}
      </div>
    </div>
    <div class="side">
      <button class="btn small primary" data-act="done" data-id="${t.id}">Done today</button>
      <a class="btn small" href="${esc(calLink(t))}" target="_blank" rel="noopener">Add to calendar</a>
      <button class="btn small" data-act="edit-task" data-id="${t.id}">Edit</button>
    </div>
  </div>`;
}

function renderUpcoming(ready) {
  const el = $("view-upcoming");
  if (!ready) { el.innerHTML = S.db === false ? "" : `<div class="empty" style="margin-top:16px">Loading your maintenance schedule…</div>`; return; }
  if (!S.tasks.length) {
    el.innerHTML = `<div class="empty" style="margin-top:16px"><strong>No maintenance scheduled yet</strong>Add a recurring task, like a filter change every 3 months or winterizing every October.<br><br><button class="btn primary" data-act="new-task" id="btn-empty-task">Add maintenance</button></div>`;
    return;
  }
  const sorted = [...S.tasks].sort((a, b) => (a.nextDue || "").localeCompare(b.nextDue || ""));
  const groups = [
    ["Overdue", sorted.filter((t) => daysUntil(t.nextDue) < 0)],
    ["Next 30 days", sorted.filter((t) => { const n = daysUntil(t.nextDue); return n >= 0 && n <= 30; })],
    ["Later", sorted.filter((t) => daysUntil(t.nextDue) > 30)],
  ];
  el.innerHTML = groups.filter(([, l]) => l.length).map(([h, l]) =>
    `<div class="group"><h3>${h} · ${l.length}</h3><div class="list">${l.map((t) => taskRow(t)).join("")}</div></div>`).join("");
}

function renderItems(ready) {
  const el = $("items-list");
  if (!ready) { el.innerHTML = S.db === false ? "" : `<div class="empty">Loading your equipment…</div>`; return; }
  if (!S.items.length) {
    el.innerHTML = `<div class="empty"><strong>Nothing logged yet</strong>Start with the big stuff: furnace, water heater, washer, mower.<br><br><button class="btn primary" data-act="new-item" id="btn-empty-item">Add item</button></div>`;
    return;
  }
  const q = $("q").value.trim().toLowerCase(), ft = $("f-type").value, fl = $("f-loc").value;
  const list = S.items
    .filter((i) => (!ft || i.type === ft) && (!fl || i.location === fl))
    .filter((i) => !q || [i.brand, i.product, i.type, i.location, i.model, i.serial, i.specs, i.parts, i.store, i.service, i.notes].join(" ").toLowerCase().includes(q))
    .sort((a, b) => itemName(a).localeCompare(itemName(b)));
  if (!list.length) { el.innerHTML = `<div class="empty">No items match that search.</div>`; return; }
  el.innerHTML = `<div class="list">${list.map((i) => {
    const w = warranty(i);
    const tasks = S.tasks.filter((t) => t.itemId === i.id);
    const next = tasks.sort((a, b) => a.nextDue.localeCompare(b.nextDue))[0];
    return `<div class="row clickable ${next ? dueClass(next.nextDue) : ""}" data-act="open-item" data-id="${i.id}" tabindex="0" role="button">
      <span class="stripe"></span>
      <div class="main">
        <div class="title">${i.brand ? `<span style="color:var(--muted);font-weight:500">${esc(i.brand)}</span> ` : ""}${esc(i.product || "Untitled item")}${i.example ? '<span class="ex">Example</span>' : ""}</div>
        <div class="meta">
          ${i.type ? `<span class="chip">${esc(i.type)}</span>` : ""}
          ${i.location ? `<span>${esc(i.location)}</span>` : ""}
          ${i.purchaseDate ? `<span>Bought ${esc(nice(i.purchaseDate))}</span>` : ""}
          ${next ? `<span class="${dueClass(next.nextDue) === "ok" ? "" : "txt-" + dueClass(next.nextDue)}">${esc(next.title)}: ${esc(rel(next.nextDue))}</span>` : ""}
        </div>
      </div>
      <div class="side"><span class="pill ${w.cls}">${esc(w.text)}</span></div>
    </div>`;
  }).join("")}</div>`;
}

/* ---------- calendar link (Google Calendar, repeating all-day event) ---------- */
function calLink(t) {
  const it = itemById(t.itemId);
  const start = t.nextDue.replace(/-/g, ""), end = addInterval(t.nextDue, 1, "days").replace(/-/g, "");
  const details = [it ? `For: ${itemName(it)}${it.location ? " (" + it.location + ")" : ""}` : "", t.notes || "", "From Homebox"].filter(Boolean).join("\n");
  const p = new URLSearchParams({ action: "TEMPLATE", text: t.title, dates: `${start}/${end}`, details,
    recur: `RRULE:FREQ=${RRULE[t.unit] || "MONTHLY"};INTERVAL=${Math.max(1, Number(t.every) || 1)}` });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

/* ---------- sheets ---------- */
const dlg = $("dlg"), sheet = $("sheet");
function openSheet(html) { sheet.innerHTML = html; if (!dlg.open) dlg.showModal(); const f = sheet.querySelector("input,select,textarea"); if (f) f.focus(); }
function closeSheet() { dlg.close(); }
dlg.addEventListener("click", (e) => { if (e.target === dlg) closeSheet(); });

function itemForm(it = {}) {
  openSheet(`<form id="item-form" data-id="${esc(it.id || "")}">
    <h2>${it.id ? "Edit item" : "Add item"}</h2>
    <div class="fields">
      <label class="f">Brand<input id="i-brand" name="brand" value="${esc(it.brand)}" placeholder="Carrier"></label>
      <label class="f">Product<input id="i-product" name="product" value="${esc(it.product)}" placeholder="Gas furnace" required></label>
      <label class="f">Product type<input id="i-type" name="type" list="dl-types" value="${esc(it.type)}" placeholder="HVAC"></label>
      <label class="f">Location<input id="i-location" name="location" list="dl-locs" value="${esc(it.location)}" placeholder="Basement"></label>
      <label class="f">Model number<input id="i-model" name="model" value="${esc(it.model)}"></label>
      <label class="f">Serial number<input id="i-serial" name="serial" value="${esc(it.serial)}"></label>
      <label class="f">Purchase date<input id="i-purchase" name="purchaseDate" type="date" value="${esc(it.purchaseDate)}"></label>
      <label class="f">Warranty ends<input id="i-warranty" name="warrantyEnd" type="date" value="${esc(it.warrantyEnd)}">
        <span class="quick"><span class="hint">From purchase:</span>${[1, 2, 5, 10].map((y) => `<button type="button" class="btn small" data-act="warr" data-y="${y}">${y} yr</button>`).join("")}</span></label>
      <label class="f full">Warranty details<input id="i-wdetails" name="warrantyNotes" value="${esc(it.warrantyNotes)}" placeholder="Parts 10 yr, labor 1 yr. Registered online."></label>
      <label class="f full">Size &amp; specs<textarea id="i-specs" name="specs" placeholder="30&quot; W x 48&quot; H. 80,000 BTU, 120V / 15A. Filter slot 16x25x1.">${esc(it.specs)}</textarea></label>
      <label class="f full">Replacement parts &amp; supplies<input id="i-parts" name="parts" value="${esc(it.parts)}" placeholder="Filter 16x25x1 MERV 8, belt A-38, bulb E26 LED"></label>
      <label class="f">Price paid<input id="i-price" name="price" inputmode="decimal" value="${esc(it.price)}" placeholder="$1,850"></label>
      <label class="f">Bought from<input id="i-store" name="store" value="${esc(it.store)}" placeholder="Home Depot, order #…"></label>
      <label class="f full">Manual or support link<input id="i-manual" name="manualUrl" type="url" value="${esc(it.manualUrl)}" placeholder="https://…"></label>
      <label class="f full">Installer or service contact<input id="i-service" name="service" value="${esc(it.service)}" placeholder="ABC Heating, 555-0142"></label>
      <label class="f full">Notes<textarea id="i-notes" name="notes" placeholder="Where the manual is, quirks, past repairs…">${esc(it.notes)}</textarea></label>
    </div>
    <div class="err" id="form-err" hidden></div>
    <footer><div class="r"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Save item</button></div></footer>
  </form>`);
}

function taskForm(t = {}, presetItem = "") {
  const itemId = t.itemId ?? presetItem;
  const opts = [...S.items].sort((a, b) => itemName(a).localeCompare(itemName(b)))
    .map((i) => `<option value="${i.id}"${i.id === itemId ? " selected" : ""}>${esc(itemName(i))}${i.location ? " · " + esc(i.location) : ""}</option>`).join("");
  openSheet(`<form id="task-form" data-id="${esc(t.id || "")}">
    <h2>${t.id ? "Edit maintenance" : "Add maintenance"}</h2>
    <div class="fields">
      <label class="f full">Task<input id="t-title" name="title" list="dl-tasks" value="${esc(t.title)}" placeholder="Replace furnace filter" required></label>
      <label class="f full">For which item<select id="t-item" name="itemId"><option value="">Not tied to an item</option>${opts}</select></label>
      <label class="f">Repeat every<span class="inline"><input id="t-every" name="every" type="number" min="1" max="99" value="${esc(t.every ?? 3)}" required>
        <select id="t-unit" name="unit">${Object.entries(UNITS).map(([k, v]) => `<option value="${k}"${(t.unit || "months") === k ? " selected" : ""}>${v}s</option>`).join("")}</select></span></label>
      <label class="f">Next due<input id="t-due" name="nextDue" type="date" value="${esc(t.nextDue || today())}" required></label>
      <label class="f full">Notes<textarea id="t-notes" name="notes" placeholder="16x25x1 MERV 8. Buy in packs of 6.">${esc(t.notes)}</textarea></label>
    </div>
    <div class="err" id="form-err" hidden></div>
    <footer>${t.id ? `<button type="button" class="btn danger" data-act="del-task" data-id="${t.id}">Delete</button>` : ""}
      <div class="r"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Save</button></div></footer>
  </form>`);
}

function itemSheet(id) {
  const it = itemById(id); if (!it) return closeSheet();
  const w = warranty(it);
  const tasks = S.tasks.filter((t) => t.itemId === id).sort((a, b) => a.nextDue.localeCompare(b.nextDue));
  const fact = (k, v, cls = "") => v ? `<dt>${k}</dt><dd class="${cls}">${esc(v)}</dd>` : "";
  openSheet(`<div data-item="${id}">
    <h2>${esc(itemName(it))}${it.example ? '<span class="ex">Example</span>' : ""}</h2>
    <dl class="facts">
      ${fact("Type", it.type)}${fact("Location", it.location)}${fact("Model", it.model, "mono")}${fact("Serial", it.serial, "mono")}
      ${fact("Purchased", [nice(it.purchaseDate), it.price, it.store].filter(Boolean).join(" · "))}
      ${fact("Size & specs", it.specs, "pre")}${fact("Parts", it.parts)}${fact("Service", it.service)}
      ${/^https?:\/\//i.test(it.manualUrl || "") ? `<dt>Manual</dt><dd><a href="${esc(it.manualUrl)}" target="_blank" rel="noopener">${esc(it.manualUrl.replace(/^https?:\/\/(www\.)?/i, "").slice(0, 60))}</a></dd>` : ""}
      <dt>Warranty</dt><dd><span class="pill ${w.cls}">${esc(w.text)}</span>${it.warrantyEnd ? ` <span class="hint">${esc(nice(it.warrantyEnd))}</span>` : ""}${it.warrantyNotes ? `<br>${esc(it.warrantyNotes)}` : ""}</dd>
      ${fact("Notes", it.notes)}
    </dl>
    <div class="sub"><span>Maintenance</span><button class="btn small" data-act="new-task" data-item="${id}">Add</button></div>
    ${tasks.length ? `<div class="list">${tasks.map((t) => taskRow(t, false)).join("")}</div>` : `<div class="empty" style="padding:16px">No maintenance set for this item.</div>`}
    <footer><button type="button" class="btn danger" data-act="del-item" data-id="${id}">Delete item</button>
      <div class="r"><button class="btn" data-act="close">Close</button><button class="btn primary" data-act="edit-item" data-id="${id}">Edit</button></div></footer>
  </div>`);
}

/* ---------- writes ---------- */
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
async function write(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const msg = "Couldn't save. Your browser's storage may be full, or blocked in private browsing.";
    const err = $("form-err"); if (err && dlg.open) { err.textContent = msg; err.hidden = false; } else toast(msg);
    return false;
  }
}
const formData = (f) => Object.fromEntries([...new FormData(f).entries()].map(([k, v]) => [k, String(v).trim()]));

document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, id = f.dataset.id;
  if (!S.db) return;
  if (f.id === "item-form") {
    const d = formData(f);
    const ref = id ? S.db.doc("items/" + id) : S.db.collection("items").doc();
    const prev = id ? itemById(id) : null;
    const body = { ...d, createdAt: prev?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
    if (prev?.example) body.example = true;
    if (await write(() => ref.set(body), id ? "Item updated" : "Item added")) itemSheet(ref.id);
  }
  if (f.id === "task-form") {
    const d = formData(f);
    const prev = id ? S.tasks.find((t) => t.id === id) : null;
    const body = { ...(prev || {}), ...d, every: Math.max(1, parseInt(d.every, 10) || 1) };
    delete body.id;
    const ref = id ? S.db.doc("tasks/" + id) : S.db.collection("tasks").doc();
    const back = sheet.dataset.back;
    if (await write(() => ref.set(body), id ? "Maintenance updated" : "Maintenance added")) {
      if (back) itemSheet(back); else closeSheet();
    }
  }
});

let armed = null;
function arm(btn, label) {
  if (armed === btn) return true;
  if (armed) { armed.classList.remove("armed"); armed.textContent = armed.dataset.label; }
  btn.dataset.label = btn.textContent; btn.textContent = label; btn.classList.add("armed"); armed = btn;
  return false;
}

document.addEventListener("click", async (e) => {
  const tab = e.target.closest("[data-view]");
  if (tab) { S.view = tab.dataset.view; for (const b of document.querySelectorAll("[data-view]")) b.setAttribute("aria-selected", b === tab); $("view-upcoming").hidden = S.view !== "upcoming"; $("view-items").hidden = S.view !== "items"; return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act !== "del-item" && act !== "del-task" && armed) { armed.classList.remove("armed"); armed.textContent = armed.dataset.label; armed = null; }
  const inItem = el.closest("[data-item]")?.dataset.item;
  switch (act) {
    case "close": return closeSheet();
    case "new-item": sheet.dataset.back = ""; return itemForm();
    case "edit-item": sheet.dataset.back = ""; return itemForm(itemById(id));
    case "open-item": sheet.dataset.back = ""; return itemSheet(id);
    case "new-task": sheet.dataset.back = el.dataset.item || ""; return taskForm({}, el.dataset.item || "");
    case "edit-task": { const back = inItem || ""; const t = S.tasks.find((x) => x.id === id); sheet.dataset.back = back; return t && taskForm(t); }
    case "warr": {
      const p = $("i-purchase").value || today();
      $("i-warranty").value = addInterval(p, el.dataset.y, "years");
      if (!$("i-purchase").value) toast("No purchase date yet, so counted from today");
      return;
    }
    case "done": {
      const t = S.tasks.find((x) => x.id === id); if (!t || !S.db) return;
      const d = today(), next = addInterval(d, t.every, t.unit);
      const history = [d, ...(t.history || [])].slice(0, 24);
      await write(() => S.db.doc("tasks/" + id).update({ lastDone: d, nextDue: next, history }), `Logged. Next due ${nice(next)}`);
      if (inItem) itemSheet(inItem);
      return;
    }
    case "del-task": {
      if (!arm(el, "Tap again to delete")) return;
      armed = null;
      const back = sheet.dataset.back;
      if (await write(() => S.db.doc("tasks/" + id).delete(), "Maintenance deleted")) { if (back) itemSheet(back); else closeSheet(); }
      return;
    }
    case "del-item": {
      const n = S.tasks.filter((t) => t.itemId === id).length;
      if (!arm(el, n ? `Also deletes ${n} task${n === 1 ? "" : "s"}. Tap again` : "Tap again to delete")) return;
      armed = null;
      const ok = await write(async () => {
        for (const t of S.tasks.filter((t) => t.itemId === id)) await S.db.doc("tasks/" + t.id).delete();
        await S.db.doc("items/" + id).delete();
      }, "Item deleted");
      if (ok) closeSheet();
      return;
    }
    case "clear-examples": {
      if (!arm(el, "Tap again to remove")) return;
      armed = null;
      await write(async () => {
        for (const t of S.tasks.filter((t) => t.example)) await S.db.doc("tasks/" + t.id).delete();
        for (const i of S.items.filter((i) => i.example)) await S.db.doc("items/" + i.id).delete();
      }, "Examples removed");
      return;
    }
    case "export": return exportCsv();
    case "backup": return backup();
    case "restore": return $("restore-file").click();
    case "do-restore": {
      if (!pendingRestore) return closeSheet();
      if (!arm(el, "Tap again to replace everything")) return;
      armed = null;
      if (await write(() => localDb.replace(pendingRestore), "Backup restored")) { pendingRestore = null; closeSheet(); }
      return;
    }  }
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".row.clickable")) { e.preventDefault(); e.target.click(); }
});
for (const id of ["q", "f-type", "f-loc"]) $(id).addEventListener("input", () => renderItems(S.loaded.items && S.loaded.tasks));

function saveFile(filename, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportCsv() {
  const cols = ["brand", "product", "type", "location", "model", "serial", "purchaseDate", "price", "store", "warrantyEnd", "warrantyNotes", "specs", "parts", "manualUrl", "service", "notes"];
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [cols.map(q).join(","), ...S.items.filter((i) => !i.example).map((i) => cols.map((c) => q(i[c])).join(","))];
  saveFile(`homebox-${today()}.csv`, "﻿" + lines.join("\r\n"), "text/csv");
}
function backup() {
  const data = { app: "homebox", version: 1, exportedAt: new Date().toISOString(), items: localDb.raw().items, tasks: localDb.raw().tasks };
  saveFile(`homebox-backup-${today()}.json`, JSON.stringify(data, null, 2), "application/json");
  setMeta({ lastBackup: today() }); render(); toast("Backup downloaded");
}
let pendingRestore = null;
$("restore-file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let data = null;
  try { data = JSON.parse(await f.text()); } catch {}
  const ok = data && data.app === "homebox" && data.items && typeof data.items === "object" && data.tasks && typeof data.tasks === "object";
  if (!ok) { toast("That file isn't a Homebox backup."); return; }
  pendingRestore = { items: data.items, tasks: data.tasks };
  sheet.dataset.back = "";
  openSheet(`<div><h2>Restore from backup</h2>
    <p>This backup from ${esc(data.exportedAt ? nice(data.exportedAt.slice(0, 10)) : "an earlier date")} has ${Object.keys(data.items).length} items and ${Object.keys(data.tasks).length} maintenance tasks.</p>
    <p>Restoring replaces everything currently in Homebox on this device.</p>
    <footer><div class="r"><button class="btn" data-act="close">Cancel</button><button class="btn danger" data-act="do-restore" id="btn-do-restore">Replace my data</button></div></footer></div>`);
});

/* ---------- local storage (this browser only) ---------- */
const KEY = "homebox:v1", META = "homebox:meta";
const blank = () => ({ items: {}, tasks: {} });
function readStore() { try { const d = JSON.parse(localStorage.getItem(KEY)); return d && d.items && d.tasks ? d : null; } catch { return null; } }
function meta() { try { return JSON.parse(localStorage.getItem(META)) || {}; } catch { return {}; } }
function setMeta(patch) { try { localStorage.setItem(META, JSON.stringify({ ...meta(), ...patch })); } catch {} }
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const localDb = (() => {
  let store = readStore() || blank();
  const listeners = { items: [], tasks: [] };
  const emit = (col) => { const docs = Object.entries(store[col]).map(([id, d]) => ({ id, data: () => d })); listeners[col].forEach((fn) => fn({ docs })); };
  function commit(mutate) {
    const before = JSON.stringify(store);
    mutate();
    try { localStorage.setItem(KEY, JSON.stringify(store)); }
    catch (e) { store = JSON.parse(before); throw e; }
    emit("items"); emit("tasks");
  }
  const ref = (col, id) => ({
    id,
    async set(d) { commit(() => { store[col][id] = JSON.parse(JSON.stringify(d)); }); },
    async update(d) { commit(() => { store[col][id] = { ...store[col][id], ...JSON.parse(JSON.stringify(d)) }; }); },
    async delete() { commit(() => { delete store[col][id]; }); },
  });
  window.addEventListener("storage", (e) => { if (e.key === KEY) { store = readStore() || blank(); emit("items"); emit("tasks"); } });
  return {
    doc(path) { const [col, id] = path.split("/"); return ref(col, id); },
    collection(col) { return { doc: (id) => ref(col, id || newId()), onSnapshot(fn) { listeners[col].push(fn); setTimeout(() => emit(col)); return () => {}; } }; },
    raw: () => JSON.parse(JSON.stringify(store)),
    async replace(next) { commit(() => { store = { items: { ...next.items }, tasks: { ...next.tasks } }; }); },
    isNew: () => readStore() === null,
  };
})();

function seedExamples() {
  const d = (n, unit = "days") => addInterval(today(), n, unit);
  const items = {
    "ex-furnace": { example: true, brand: "Carrier", product: "Performance 96 gas furnace", type: "HVAC", location: "Basement", model: "59SC5A060E17", purchaseDate: d(-5, "years"), price: "$3,400 installed", store: "ABC Heating & Cooling", warrantyEnd: d(5, "years"), warrantyNotes: "Parts 10 yr (registered). Labor 1 yr.", specs: "60,000 BTU, 96% AFUE\n120V / 15A circuit\n17.5\" W x 33\" H x 29.5\" D", parts: "Filter 16x25x1 MERV 8", service: "ABC Heating, 555-0142", notes: "Filter slot is on the left side of the blower cabinet." },
    "ex-heater": { example: true, brand: "Rheem", product: "50 gal water heater", type: "Plumbing", location: "Utility closet", purchaseDate: d(-6, "years"), warrantyEnd: d(40), warrantyNotes: "6 yr tank warranty" },
    "ex-mower": { example: true, brand: "Honda", product: "HRN216 lawn mower", type: "Yard & garden", location: "Garage", model: "HRN216VKA", purchaseDate: d(-3, "years"), parts: "Blade 72511-VH7-000, spark plug NGK BPR5ES" },
  };
  const tasks = {
    "ex-filter": { example: true, title: "Replace furnace filter", itemId: "ex-furnace", every: 3, unit: "months", nextDue: d(-10), lastDone: d(-100), notes: "16x25x1 MERV 8", history: [d(-100)] },
    "ex-blower": { example: true, title: "Oil blower motor", itemId: "ex-furnace", every: 1, unit: "years", nextDue: d(14), lastDone: d(-351), notes: "2-3 drops SAE 20 non-detergent oil in each port.", history: [d(-351)] },
    "ex-flush": { example: true, title: "Flush water heater", itemId: "ex-heater", every: 1, unit: "years", nextDue: d(4, "months"), lastDone: d(-8, "months"), history: [d(-8, "months")] },
    "ex-winter": { example: true, title: "Winterize mower", itemId: "ex-mower", every: 1, unit: "years", nextDue: d(21), notes: "Add fuel stabilizer, run dry, change oil.", history: [] },
  };
  return localDb.replace({ items, tasks });
}

/* ---------- boot ---------- */
render();
(async () => {
  S.db = localDb;
  if (localDb.isNew()) { try { await seedExamples(); } catch {} }
  localDb.collection("items").onSnapshot((s) => { S.items = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.items = true; render(); refreshSheet(); });
  localDb.collection("tasks").onSnapshot((s) => { S.tasks = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.tasks = true; render(); refreshSheet(); });
  try { navigator.storage?.persist?.(); } catch {}
})();
function refreshSheet() {
  const open = dlg.open && sheet.querySelector("[data-item]");
  if (open) itemSheet(open.dataset.item);
}
</script>
